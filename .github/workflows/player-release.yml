name: Player Release

# Tag player-v* -> build the Player (eustress-client) on three platforms
# -> installers that register eustress-player:// -> SHA-256 checksums
# -> player/latest.json -> R2 -> GitHub Release.
#
# A manual run can publish to staging first. channel=staging (the default)
# writes the bucket prefix staging/player, served at
# downloads.eustress.dev/staging/player, puts "channel": "staging" in
# latest.json, points changelog_url at this workflow run (there is no
# player-v* tag), and does not create a GitHub Release. It does not touch
# player/latest.json. A staging build is compiled for
# https://api-staging.eustress.dev (EUSTRESS_DEFAULT_API_URL on the three
# cargo builds only). A production build leaves that variable unset, so the
# Player stays on https://api.eustress.dev. The Gallery site follows the API
# (site_base in eustress-common); there is no separate gallery URL to set.
# A player-v* tag, or channel=production, writes the production player/
# paths below.
#
# The Player's counterpart to release.yml, which ships Studio. Same bucket,
# same Worker, same credentials. The Player publishes under the bucket's
# player/ prefix, so neither release can overwrite the other's manifest, and
# downloads.eustress.dev serves it at:
#   /player/latest.json                 the manifest, same shape as Studio's
#   /player/latest/<platform>           302 to the current release's file
#   /player/vX.Y.Z/<file>               the artifacts
# Staging mirrors those three under /staging/player/. The routes live in
# infrastructure/cloudflare/download-worker.js.
#
# The Player versions independently of Studio: the tag player-vX.Y.Z must
# match eustress/crates/client/Cargo.toml.
#
# Required repository secrets (shared with release.yml):
#   CLOUDFLARE_API_TOKEN   scoped to Object Read & Write on eustress-downloads
#   CLOUDFLARE_ACCOUNT_ID
# Windows signing, Azure Trusted Signing (required for any publish to R2,
# staging included; a build-only run goes ahead unsigned and says so):
#   secrets   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#             (an app registration with the "Artifact Signing Certificate
#             Profile Signer" role on the signing account)
#   variables TRUSTED_SIGNING_ENDPOINT (the account's region endpoint, e.g.
#             https://wus2.codesigning.azure.net/), TRUSTED_SIGNING_ACCOUNT,
#             TRUSTED_SIGNING_PROFILE
# The Player exe (before packaging, so the zip and the installer carry it)
# and EustressPlayer-Setup.exe are signed and their signatures checked.
# macOS signing, Eustress LLC's Developer ID plus notarization (also
# required for any publish):
#   secrets   APPLE_DEVELOPER_ID_P12 (base64 of the Developer ID Application
#             certificate and key), APPLE_DEVELOPER_ID_P12_PASSWORD,
#             APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8
#             (base64 of the App Store Connect API key's .p8)
# The app and the DMG are signed, the DMG notarized and stapled, and
# Gatekeeper's assessment checked before upload.

on:
  push:
    tags: ["player-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Player version to build (X.Y.Z, without the leading player-v)"
        required: true
      publish:
        description: "Upload to R2. Off: build and test only; the installers stay as run artifacts. A GitHub Release is created only for a player-v* tag, never for staging."
        type: boolean
        default: false
      channel:
        description: "staging writes staging/player and leaves player/latest.json alone. production writes the player/ paths a tag push uses. Ignored on a tag push, which is always production."
        type: choice
        default: staging
        options:
          - staging
          - production
      min_version:
        description: "Optional X.Y.Z: the oldest Player still allowed to play. Written to latest.json as min_version; older Players ask to update. Empty: no minimum."
        required: false
        default: ""
      unsigned:
        description: "Publish UNSIGNED Windows and Linux builds and leave macOS out (not built, not in latest.json), on either channel. Every Windows downloader sees an unknown-publisher warning. Never on a tag push."
        type: boolean
        default: false

permissions:
  contents: write

# One Player publish at a time, staging or production.
concurrency:
  group: player-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_LTO: thin
  # The bucket. The prefix and the public base are chosen once, in the
  # version job: player/ for a tag or channel=production, staging/player
  # otherwise. The Worker's routes have to match.
  R2_BUCKET: eustress-downloads

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Version and gating.
  #
  # The version is derived once and passed down, so a tag, the crate, the
  # installer and player/latest.json cannot disagree.
  # ─────────────────────────────────────────────────────────────────────
  version:
    name: Resolve version and verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      r2_prefix: ${{ steps.channel.outputs.r2_prefix }}
      download_base: ${{ steps.channel.outputs.download_base }}
      release_channel: ${{ steps.channel.outputs.release_channel }}
      default_api_url: ${{ steps.channel.outputs.default_api_url }}
      sign_windows: ${{ steps.signing.outputs.sign_windows }}
      sign_macos: ${{ steps.signing.outputs.sign_macos }}
      include_macos: ${{ steps.signing.outputs.include_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#player-v}"
          fi
          # The Worker serves only vX.Y.Z paths under player/ and
          # staging/player/, so any other shape would build for half an
          # hour and then publish something no link can reach.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${VERSION}' is not X.Y.Z. downloads.eustress.dev serves Player releases only at player/vX.Y.Z/ and staging/player/vX.Y.Z/."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # A player-v* tag is production. A manual run is staging unless it
      # asks for production, so a staging publish cannot overwrite
      # player/latest.json. The input arrives as an environment variable:
      # it is a choice of two words, and it is not interpolated into the
      # shell.
      - id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$INPUT_CHANNEL" = "production" ]; then
            echo "r2_prefix=player" >> "$GITHUB_OUTPUT"
            echo "download_base=https://downloads.eustress.dev/player" >> "$GITHUB_OUTPUT"
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "default_api_url=" >> "$GITHUB_OUTPUT"
            echo "Production: R2 prefix player/ (${EVENT_NAME}). EUSTRESS_DEFAULT_API_URL is unset."
          else
            echo "r2_prefix=staging/player" >> "$GITHUB_OUTPUT"
            echo "download_base=https://downloads.eustress.dev/staging/player" >> "$GITHUB_OUTPUT"
            echo "release_channel=staging" >> "$GITHUB_OUTPUT"
            echo "default_api_url=https://api-staging.eustress.dev" >> "$GITHUB_OUTPUT"
            echo "Staging: R2 prefix staging/player/. The Player is compiled for https://api-staging.eustress.dev. player/latest.json is not written, and no GitHub Release is created."
          fi

      # Nothing reaches R2 unsigned without asking (McKale, 2026-11-13):
      # Windows through Azure Artifact Signing, macOS with Eustress LLC's
      # Developer ID and Apple notarization. A build-only run may go ahead
      # without them and keeps its installers as run artifacts. The one way
      # past it is a dispatched run with unsigned=true, below.
      - id: signing
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          TS_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          HAS_TENANT: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_CLIENT: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' }}
          HAS_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          UNSIGNED: ${{ inputs.unsigned }}
        run: |
          win=""
          [ -n "$TS_ENDPOINT" ] || win="$win variable TRUSTED_SIGNING_ENDPOINT,"
          [ -n "$TS_ACCOUNT" ] || win="$win variable TRUSTED_SIGNING_ACCOUNT,"
          [ -n "$TS_PROFILE" ] || win="$win variable TRUSTED_SIGNING_PROFILE,"
          [ "$HAS_TENANT" = "true" ] || win="$win secret AZURE_TENANT_ID,"
          [ "$HAS_CLIENT" = "true" ] || win="$win secret AZURE_CLIENT_ID,"
          [ "$HAS_SECRET" = "true" ] || win="$win secret AZURE_CLIENT_SECRET,"
          mac=""
          [ "$HAS_P12" = "true" ] || mac="$mac secret APPLE_DEVELOPER_ID_P12,"
          [ "$HAS_P12_PASSWORD" = "true" ] || mac="$mac secret APPLE_DEVELOPER_ID_P12_PASSWORD,"
          [ "$HAS_API_KEY_ID" = "true" ] || mac="$mac secret APPLE_API_KEY_ID,"
          [ "$HAS_API_ISSUER" = "true" ] || mac="$mac secret APPLE_API_ISSUER_ID,"
          [ "$HAS_API_KEY" = "true" ] || mac="$mac secret APPLE_API_KEY_P8,"
          if [ -z "$win" ]; then
            echo "sign_windows=true" >> "$GITHUB_OUTPUT"
            echo "Windows signing: Azure Artifact Signing, account $TS_ACCOUNT, profile $TS_PROFILE."
          else
            echo "sign_windows=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Windows signing is not configured (missing:${win%,})."
          fi
          if [ -z "$mac" ]; then
            echo "sign_macos=true" >> "$GITHUB_OUTPUT"
            echo "macOS signing: Developer ID and notarization."
          else
            echo "sign_macos=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS signing is not configured (missing:${mac%,})."
          fi
          # The exception McKale allowed (staging and then production,
          # 2026-11-13): a dispatched publish of unsigned Windows and Linux
          # builds, with macOS left out. A tag push is always signed.
          if [ "$UNSIGNED" = "true" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::error::unsigned is for a dispatched run only. A player-v* tag push is always signed."
              exit 1
            fi
            echo "include_macos=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNSIGNED publish: Windows and Linux only, unsigned; macOS is not built and not listed."
            exit 0
          fi
          echo "include_macos=true" >> "$GITHUB_OUTPUT"
          if [ -n "$win$mac" ] && { [ "$EVENT_NAME" = "push" ] || [ "$PUBLISH" = "true" ]; }; then
            echo "::error::Refusing to publish an unsigned Player. Missing:${win}${mac%,}. Set them in the repository's Actions settings, then run again."
            exit 1
          fi

      # RELEASE.md's promotion model applies to the Player as it does to
      # Studio: releases ship from Core only.
      - name: Assert tagged commit is on Core
        if: github.event_name == 'push'
        run: |
          git fetch origin Core:refs/remotes/origin/Core
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/Core; then
            echo "::error::Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not reachable from origin/Core. Releases must be tagged on Core, see RELEASE.md."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} is on Core."

      # `eustress-client --version` reports CARGO_PKG_VERSION, and each build
      # job checks the binary against this tag. A mismatch caught here costs
      # seconds instead of three platform builds.
      - name: Assert crate version matches the tag
        run: |
          WANT="${{ steps.v.outputs.version }}"
          HAVE=$(grep -m1 '^version' eustress/crates/client/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::This Player release is ${WANT}, but eustress/crates/client/Cargo.toml says ${HAVE}. Bump the crate version to match before tagging, or the shipped Player reports ${HAVE}."
            exit 1
          fi
          echo "OK: crate version ${HAVE} matches."

  # ─────────────────────────────────────────────────────────────────────
  # Windows x64
  # ─────────────────────────────────────────────────────────────────────
  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BIN_DIR: eustress/target/x86_64-pc-windows-msvc/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eustress
          # Apart from Studio's cache: the two graphs and flags differ, and
          # one shared key would evict the other on every release.
          key: player

      # A static C runtime, so the Player starts on a Windows install that
      # never received the Visual C++ redistributable. The flag goes through
      # --config, which adds to .cargo/config.toml's lld-link flags where a
      # RUSTFLAGS variable would replace them (see [profile.dist] in
      # eustress/Cargo.toml), and the explicit --target keeps it off build
      # scripts and proc macros.
      - name: Build
        working-directory: eustress
        shell: pwsh
        env:
          # Empty on a production build. Drop it so option_env! is None.
          EUSTRESS_DEFAULT_API_URL: ${{ needs.version.outputs.default_api_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EUSTRESS_DEFAULT_API_URL)) {
            Remove-Item Env:\EUSTRESS_DEFAULT_API_URL -ErrorAction SilentlyContinue
          }
          cargo build --release --locked --package eustress-client --bin eustress-client `
            --target x86_64-pc-windows-msvc `
            --config "target.x86_64-pc-windows-msvc.rustflags=['-C','target-feature=+crt-static']"

      - name: Check the runtime is linked in
        shell: pwsh
        run: |
          # The launch check below runs on windows-latest, which has the Visual C++ runtime
          # installed, so it cannot see a dynamic link. Name the DLLs instead: a binary that
          # imports one, or loads one by name, needs it on the user's machine.
          $exe = "$env:BIN_DIR\eustress-client.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $named = @('VCRUNTIME140', 'MSVCP140', 'CONCRT140', 'VCOMP140') |
            Where-Object { $text.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -ge 0 }
          if ($named) { throw "$exe names $($named -join ', '): the Visual C++ runtime is linked dynamically, so a fresh Windows install will not start it." }
          "OK: $exe names no Visual C++ runtime DLL"

      - name: Check the reported version
        shell: pwsh
        run: |
          # Also the first launch: a missing DLL fails here, before packaging.
          # The release Player is a windows-subsystem app, so `&` neither waits
          # for it nor keeps its stdout open; Start-Process -Wait does both.
          $out = "$env:RUNNER_TEMP\version.txt"
          $p = Start-Process -FilePath "$env:BIN_DIR\eustress-client.exe" -ArgumentList "--version" `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          if ($p.ExitCode -ne 0) { throw "eustress-client --version exited $($p.ExitCode)" }
          $got = (Get-Content -Raw $out).Trim()
          if ($got -ne "eustress-client $env:VERSION") { throw "--version printed '$got', want 'eustress-client $env:VERSION'" }
          "OK: $got"

      - name: Smoke test
        shell: pwsh
        run: |
          # Catches an immediate startup panic (unwrap-on-None, config parse
          # failure) before a broken binary is packaged. NOT a rendering test:
          # windows-latest has no real GPU, so a graceful exit for lack of an
          # adapter is not distinguished from success. A floor, not a
          # guarantee.
          $p = Start-Process -FilePath "$env:BIN_DIR\eustress-client.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error "eustress-client.exe exited within 8s (exit $($p.ExitCode)) - treating as a startup crash."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "OK: still running after 8s."

      # Azure Artifact Signing (formerly Trusted Signing): the key stays in
      # Microsoft's service and the runner signs through it, so there is no
      # certificate file to store. Skipped (and the run says so) until the
      # TRUSTED_SIGNING_* variables exist; the version job refuses any R2
      # upload until then. The path must match BIN_DIR above.
      - name: Sign the Player
        if: needs.version.outputs.sign_windows == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\eustress\target\x86_64-pc-windows-msvc\release\eustress-client.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the Player's signature
        if: needs.version.outputs.sign_windows == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:BIN_DIR\eustress-client.exe"
          if ($sig.Status -ne 'Valid') { throw "eustress-client.exe signature is $($sig.Status): $($sig.StatusMessage)" }
          "OK: eustress-client.exe signed by $($sig.SignerCertificate.Subject)"

      - name: Note an unsigned build
        if: needs.version.outputs.sign_windows != 'true'
        shell: pwsh
        run: Write-Warning "Trusted Signing is not configured, so this build is UNSIGNED. It stays a run artifact; the version job refuses to publish it."

      - name: Package
        shell: pwsh
        run: |
          # The layout the installer ships too, staged outside dist/ so that
          # dist/ holds only the files this job uploads.
          ./installer/stage-player.ps1 -BinDir $env:BIN_DIR -OutDir player-stage
          New-Item -ItemType Directory -Force dist | Out-Null
          Push-Location player-stage
          7z a "../dist/eustress-player-v$env:VERSION-windows-x64.zip" *
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Build installer
        shell: pwsh
        run: |
          # Setup's own icon: the one eustress-client's build script rendered
          # from assets/icon.svg. The newest build directory is this build's.
          $ico = Get-Item "$env:BIN_DIR/build/eustress-client-*/out/icon.ico",
                          "eustress/target/release/build/eustress-client-*/out/icon.ico" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $iconArg = @()
          if ($ico) { $iconArg = @("/DSetupIcon=$($ico.FullName)") }
          else { Write-Warning "icon.ico from eustress-client's build script was not found; Setup carries Inno's default icon." }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:VERSION" `
            "/DStageDir=..\..\player-stage" `
            @iconArg `
            installer\windows\eustress-player.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item dist\windows\EustressPlayer-Setup.exe dist\ -Force

      - name: Sign the installer
        if: needs.version.outputs.sign_windows == 'true'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\EustressPlayer-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the installer's signature
        if: needs.version.outputs.sign_windows == 'true'
        shell: pwsh
        run: |
          foreach ($f in @('dist\EustressPlayer-Setup.exe')) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f signature is $($sig.Status): $($sig.StatusMessage)" }
            "OK: $f signed by $($sig.SignerCertificate.Subject)"
          }
          # The zip was packed from the signed exe; check the copy inside it.
          $zip = Get-Item dist\eustress-player-v*-windows-x64.zip
          $out = "$env:RUNNER_TEMP\zipcheck"
          7z x $zip.FullName "-o$out" eustress-client.exe -r -y | Out-Null
          $inner = Get-ChildItem $out -Recurse -Filter eustress-client.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $inner.FullName
          if ($sig.Status -ne 'Valid') { throw "the zip's eustress-client.exe signature is $($sig.Status)" }
          "OK: the zip carries the signed eustress-client.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  # ─────────────────────────────────────────────────────────────────────
  # macOS ARM64
  # ─────────────────────────────────────────────────────────────────────
  build-macos-arm64:
    needs: version
    if: needs.version.outputs.include_macos != 'false'
    runs-on: macos-15 # Apple Silicon; GitHub retired the macos-14 arm64 runner
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BIN_DIR: eustress/target/aarch64-apple-darwin/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eustress
          key: player

      - name: Build
        working-directory: eustress
        env:
          # Empty on a production build. Drop it so option_env! is None.
          EUSTRESS_DEFAULT_API_URL: ${{ needs.version.outputs.default_api_url }}
        run: |
          if [ -z "${EUSTRESS_DEFAULT_API_URL:-}" ]; then
            unset EUSTRESS_DEFAULT_API_URL
          fi
          cargo build --release --locked --package eustress-client --bin eustress-client --target aarch64-apple-darwin

      - name: Check the reported version
        run: |
          GOT=$("$BIN_DIR/eustress-client" --version)
          if [ "$GOT" != "eustress-client ${VERSION}" ]; then
            echo "::error::--version printed '${GOT}', want 'eustress-client ${VERSION}'"
            exit 1
          fi
          echo "OK: ${GOT}"

      - name: Smoke test
        run: |
          "$BIN_DIR/eustress-client" &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID"; STATUS=$?
            echo "::error::eustress-client exited within 8s (exit $STATUS) - treating as a startup crash."
            exit 1
          fi
          kill "$PID"
          echo "OK: still running after 8s."

      # Eustress LLC's Developer ID certificate, into a keychain that lives
      # only for this job. The identity's name goes to the steps below.
      - name: Import the Developer ID certificate
        if: needs.version.outputs.sign_macos == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::The certificate in APPLE_DEVELOPER_ID_P12 holds no 'Developer ID Application' identity."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "OK: signing as $IDENTITY"

      - name: Package DMG
        env:
          SIGN_MACOS: ${{ needs.version.outputs.sign_macos }}
        run: |
          pwsh installer/stage-player.ps1 -BinDir "$BIN_DIR" -OutDir player-stage

          APP="dmg/Eustress Player.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp player-stage/eustress-client "$APP/Contents/MacOS/"
          # Assets belong in Resources. The Player looks beside its executable,
          # so a link in MacOS/ leads it there.
          mv player-stage/common "$APP/Contents/Resources/common"
          ln -s ../Resources/common "$APP/Contents/MacOS/common"

          # The icon eustress-client's build script rendered from
          # assets/icon.svg. The newest build directory is this build's.
          PNG=$(ls -t "$BIN_DIR"/build/eustress-client-*/out/icon_256.png \
                      eustress/target/release/build/eustress-client-*/out/icon_256.png 2>/dev/null | head -1)
          if [ -z "$PNG" ]; then
            echo "::warning::icon_256.png from eustress-client's build script was not found; the Player app ships without its icon."
          else
            mkdir AppIcon.iconset
            for s in 16 32 128 256; do
              sips -z "$s" "$s" "$PNG" --out "AppIcon.iconset/icon_${s}x${s}.png" > /dev/null
            done
            for s in 16 32 128; do
              sips -z $((s * 2)) $((s * 2)) "$PNG" --out "AppIcon.iconset/icon_${s}x${s}@2x.png" > /dev/null
            done
            if ! iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"; then
              echo "::warning::iconutil failed; the Player app ships without its icon."
            fi
          fi

          # CFBundleURLTypes makes the Player the handler for eustress-player://
          # once the app is in Applications or has been opened once.
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Eustress Player</string>
            <key>CFBundleDisplayName</key><string>Eustress Player</string>
            <key>CFBundleExecutable</key><string>eustress-client</string>
            <key>CFBundleIdentifier</key><string>dev.eustress.player</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>dev.eustress.player</string>
                <key>CFBundleURLSchemes</key>
                <array><string>eustress-player</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"

          # Sign the executable, then the bundle that seals it, with the
          # hardened runtime notarization requires and a secure timestamp.
          if [ "$SIGN_MACOS" = "true" ]; then
            codesign --force --options runtime --timestamp --keychain "$SIGNING_KEYCHAIN" \
              --sign "$SIGNING_IDENTITY" "$APP/Contents/MacOS/eustress-client"
            codesign --force --options runtime --timestamp --keychain "$SIGNING_KEYCHAIN" \
              --sign "$SIGNING_IDENTITY" "$APP"
            codesign --verify --strict --deep --verbose=2 "$APP"
          else
            echo "::warning::Developer ID signing is not configured, so this app is UNSIGNED. It stays a run artifact; the version job refuses to publish it."
          fi

          # Drag-to-install: the image opens beside a link to Applications.
          ln -s /Applications dmg/Applications
          DMG="dist/eustress-player-v${VERSION}-macos-arm64.dmg"
          hdiutil create -volname "Eustress Player" -srcfolder dmg -ov -format UDZO "$DMG"
          if [ "$SIGN_MACOS" = "true" ]; then
            codesign --force --timestamp --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$DMG"
          fi

      # Apple checks the signed image and issues a ticket; stapling attaches
      # it, so Gatekeeper opens the Player even offline. Waits up to 30 min.
      - name: Notarize the DMG
        if: needs.version.outputs.sign_macos == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          DMG="dist/eustress-player-v${VERSION}-macos-arm64.dmg"
          KEY="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$KEY"
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          STATUS=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || echo unknown)
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
            [ -n "$ID" ] && xcrun notarytool log "$ID" --key "$KEY" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            rm -f "$KEY"
            echo "::error::Apple did not accept the DMG for notarization (status: $STATUS)."
            exit 1
          fi
          rm -f "$KEY"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "OK: notarized and stapled"

      # Opens the finished image the way a user does and checks what they see:
      # the app, a link to Applications, the assets, and this release's version.
      - name: Verify the DMG
        run: |
          fail() { echo "::error::$1"; exit 1; }
          DMG="dist/eustress-player-v${VERSION}-macos-arm64.dmg"
          [ -f "$DMG" ] || fail "$DMG was not built."
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -readonly -quiet
          trap 'hdiutil detach "$MNT" -quiet -force || true' EXIT

          APP="$MNT/Eustress Player.app"
          BIN="$APP/Contents/MacOS/eustress-client"
          [ -d "$APP" ] || fail "The image has no 'Eustress Player.app' at its root; it holds: $(ls "$MNT")"
          [ -x "$BIN" ] || fail "$BIN is missing or not executable."
          [ "$(readlink "$MNT/Applications")" = "/Applications" ] \
            || fail "The image has no link to /Applications beside the app."
          [ -d "$APP/Contents/Resources/common/assets/class_schema" ] \
            || fail "The common assets did not reach the bundle."
          [ -d "$APP/Contents/MacOS/common/assets" ] \
            || fail "The link from MacOS/common to the assets does not resolve."
          [ -f "$APP/Contents/Resources/AppIcon.icns" ] \
            || echo "::warning::AppIcon.icns is missing; the Player app has no icon."
          plutil -lint "$APP/Contents/Info.plist"
          GOT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          [ "$GOT" = "$VERSION" ] || fail "Info.plist says version '${GOT}', want '${VERSION}'."
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Contents/Info.plist" \
            | grep -qx "eustress-player" || fail "Info.plist does not register the eustress-player:// scheme."
          ARCHS=$(lipo -archs "$BIN")
          [ "$ARCHS" = "arm64" ] || fail "The executable is '${ARCHS}', want 'arm64'."
          # Signed: the seal holds, and Gatekeeper accepts the image and the
          # app as a downloaded copy would be judged.
          if [ "$SIGN_MACOS" = "true" ]; then
            codesign --verify --strict --deep --verbose=2 "$APP" || fail "The app's signature does not verify."
            spctl --assess --type execute --verbose "$APP" || fail "Gatekeeper rejects the app."
            spctl --assess --type open --context context:primary-signature --verbose "$DMG" \
              || fail "Gatekeeper rejects the DMG."
            xcrun stapler validate "$DMG" || fail "The DMG carries no notarization ticket."
          fi
          echo "OK: $(basename "$DMG") opens to the app and a link to Applications."
        env:
          SIGN_MACOS: ${{ needs.version.outputs.sign_macos }}

      - name: Remove the signing keychain
        if: always() && needs.version.outputs.sign_macos == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────
  # Linux x64
  #
  # Runner headroom as in release.yml: a release Bevy link has run the
  # hosted runner out of memory or disk before, so this job trades build
  # time for headroom.
  # ─────────────────────────────────────────────────────────────────────
  build-linux:
    needs: version
    runs-on: ubuntu-22.04 # oldest supported glibc, so the binary runs widely
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      # Keep the symbol table through the checks below (the static-initializer
      # guard reads it, and gdb names frames with it); Package strips it.
      CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
      CARGO_BUILD_JOBS: 2
      VERSION: ${{ needs.version.outputs.version }}
      BIN_DIR: eustress/target/release
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: eustress
          key: player

      # mesa-vulkan-drivers gives the smoke test a software Vulkan adapter;
      # librsvg2-bin renders the desktop icons from the Player's SVG.
      # libxkbcommon-x11-0 is loaded at runtime by winit on X11; desktops ship
      # it, the runner image does not, and the smoke test panics without it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libvulkan-dev libx11-dev libxi-dev libxcursor-dev \
            mesa-vulkan-drivers librsvg2-bin mold clang xvfb \
            libxkbcommon-x11-0 gdb

      - name: Build
        working-directory: eustress
        run: |
          # Empty on a production build. Drop it so option_env! is None.
          if [ -z "${EUSTRESS_DEFAULT_API_URL:-}" ]; then
            unset EUSTRESS_DEFAULT_API_URL
          fi
          cargo build --release --locked --package eustress-client --bin eustress-client
        # The system linker, not mold: under mold the Player started with
        # Luau's C++ static initializers unrun (kSizeClassConfig all zero), and
        # lua_newstate divided by a zero block size (SIGFPE) at startup.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          EUSTRESS_DEFAULT_API_URL: ${{ needs.version.outputs.default_api_url }}

      # A linker that drops a C++ static initializer passes every Rust check
      # and fails only at run time, so the binary is checked for Luau's.
      - name: Check that Luau's static initializers are linked
        run: |
          nm -C "$BIN_DIR/eustress-client" | grep -E '_GLOBAL__sub_I_.*lmem' || { echo "::error::lmem.cpp's static initializer is missing"; exit 1; }
          readelf -S -W "$BIN_DIR/eustress-client" | grep -E 'init_array'

      - name: Check the reported version
        run: |
          GOT=$("$BIN_DIR/eustress-client" --version)
          if [ "$GOT" != "eustress-client ${VERSION}" ]; then
            echo "::error::--version printed '${GOT}', want 'eustress-client ${VERSION}'"
            exit 1
          fi
          echo "OK: ${GOT}"

      # Diagnostic: a native crash (a signal such as SIGFPE, not a Rust panic)
      # prints no backtrace. Under gdb the faulting thread's stack, the
      # faulting instruction and every thread's stack are printed. A run that
      # does not crash within 40 s is interrupted, so the step always ends;
      # it never fails the job, and the smoke test below still decides.
      - name: Backtrace a startup crash (diagnostic)
        continue-on-error: true
        run: |
          xvfb-run --auto-servernum \
            timeout --signal=INT --kill-after=15 40 \
            gdb -batch -nx \
              -ex "set pagination off" \
              -ex "handle SIGPIPE nostop noprint" \
              -ex run \
              -ex bt \
              -ex "x/8i \$pc" \
              -ex "info registers" \
              -ex "thread apply all bt 16" \
              --args "$BIN_DIR/eustress-client" 2>&1 | tail -n 400 || true

      - name: Smoke test
        run: |
          # xvfb gives it a display so surface creation does not hard-fail
          # purely for lack of one. A software rasterizer still exercises
          # real startup code, unlike running with no display.
          xvfb-run --auto-servernum "$BIN_DIR/eustress-client" &
          PID=$!
          sleep 8
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID"; STATUS=$?
            echo "::error::eustress-client exited within 8s (exit $STATUS) - treating as a startup crash."
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "OK: still running after 8s."

      - name: Package
        run: |
          # The checks above needed the symbol table; what ships does not.
          # Strip to a new file and move it over: the smoke test's Player may
          # still hold the old one open ("Text file busy" for strip in place).
          strip --strip-all -o "$BIN_DIR/eustress-client.stripped" "$BIN_DIR/eustress-client"
          mv -f "$BIN_DIR/eustress-client.stripped" "$BIN_DIR/eustress-client"
          # One top-level folder, so unpacking never scatters files.
          STAGE=pkg/eustress-player
          pwsh installer/stage-player.ps1 -BinDir "$BIN_DIR" -OutDir "$STAGE"
          mkdir -p "$STAGE/icons" dist
          for s in 16 32 48 64 128 256 512; do
            rsvg-convert -w "$s" -h "$s" eustress/crates/client/assets/icon.svg \
              -o "$STAGE/icons/eustress-player-${s}.png"
          done
          cp eustress/crates/client/assets/linux/eustress-player.desktop "$STAGE/"
          cp eustress/crates/client/assets/linux/install.sh "$STAGE/"
          chmod +x "$STAGE/install.sh" "$STAGE/eustress-client"
          tar czf "dist/eustress-player-v${VERSION}-linux-x64.tar.gz" -C pkg eustress-player

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ─────────────────────────────────────────────────────────────────────
  # Publish
  # ─────────────────────────────────────────────────────────────────────
  publish:
    needs: [version, build-windows, build-macos-arm64, build-linux]
    # A tag push publishes. A dispatched run publishes only when asked, so a
    # manual run can prove the three builds before anything goes public.
    # macOS may be skipped only by an unsigned run, which leaves it out.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || inputs.publish) &&
      needs.version.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      (needs.build-macos-arm64.result == 'success' ||
       (needs.build-macos-arm64.result == 'skipped' && needs.version.outputs.include_macos == 'false'))
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      R2_PREFIX: ${{ needs.version.outputs.r2_prefix }}
      DOWNLOAD_BASE: ${{ needs.version.outputs.download_base }}
      RELEASE_CHANNEL: ${{ needs.version.outputs.release_channel }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: mkdir -p dist && find artifacts -type f -exec mv {} dist/ \; && ls -la dist

      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      # Same shape as Studio's latest.json, so one parser reads both.
      - name: Build latest.json
        working-directory: dist
        env:
          INCLUDE_MACOS: ${{ needs.version.outputs.include_macos }}
          MIN_VERSION: ${{ inputs.min_version }}
        run: |
          # The oldest Player still allowed to play, when this run names one.
          # It may not be above the version being released.
          MIN_LINE=""
          if [ -n "$MIN_VERSION" ]; then
            if ! printf '%s' "$MIN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::min_version '${MIN_VERSION}' is not X.Y.Z."
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$MIN_VERSION" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "::error::min_version ${MIN_VERSION} is above the version being released (${VERSION})."
              exit 1
            fi
            MIN_LINE="\"min_version\": \"${MIN_VERSION}\","
          fi
          sha()  { grep " $1\$" checksums.txt | awk '{print $1}'; }
          size() { stat -c%s "$1"; }

          WIN=$(ls eustress-player-*-windows-x64.zip 2>/dev/null | head -1)
          SETUP=$(ls EustressPlayer-Setup.exe 2>/dev/null | head -1)
          MAC=$(ls eustress-player-*-macos-arm64.dmg 2>/dev/null | head -1)
          LIN=$(ls eustress-player-*-linux-x64.tar.gz 2>/dev/null | head -1)

          BASE="${DOWNLOAD_BASE}/v${VERSION}"

          # A tag push names the GitHub Release for its tag. A dispatched run,
          # staging or production, has no tag and creates no Release, so
          # changelog_url is the workflow run that built the files.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            CHANGELOG_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            CHANGELOG_URL="https://github.com/WeaveITMeta/EustressEngine/releases/tag/player-v${VERSION}"
          fi

          # macOS is listed unless an unsigned run left it out; a
          # missing DMG on any other run still fails the check below.
          if [ "$INCLUDE_MACOS" = "false" ]; then
            MAC_LINE=""
          else
            MAC_LINE="\"macos-arm64\": { \"file\": \"${MAC}\", \"url\": \"${BASE}/${MAC}\", \"sha256\": \"$(sha "$MAC")\", \"size_bytes\": $(size "$MAC" 2>/dev/null || echo 0), \"installer\": true },"
          fi

          cat > latest.json <<JSON
          {
            "version": "${VERSION}",
            ${MIN_LINE}
            "date": "$(date -u +%Y-%m-%d)",
            "channel": "${RELEASE_CHANNEL}",
            "changelog_url": "${CHANGELOG_URL}",
            "platforms": {
              "windows-x64":           { "file": "${WIN}",   "url": "${BASE}/${WIN}",   "sha256": "$(sha "$WIN")",   "size_bytes": $(size "$WIN"),   "installer": false },
              "windows-x64-installer": { "file": "${SETUP}", "url": "${BASE}/${SETUP}", "sha256": "$(sha "$SETUP")", "size_bytes": $(size "$SETUP"), "installer": true },
              ${MAC_LINE}
              "linux-x64":             { "file": "${LIN}",   "url": "${BASE}/${LIN}",   "sha256": "$(sha "$LIN")",   "size_bytes": $(size "$LIN"),   "installer": false }
            }
          }
          JSON
          cat latest.json

          # Fail loudly rather than publishing a manifest with a missing
          # artifact or an empty checksum. A manifest that parses but points
          # at nothing is worse than no manifest: the website trusts it.
          node -e '
            const m = require("./latest.json");
            for (const [k, v] of Object.entries(m.platforms)) {
              if (!v.file || !v.sha256 || !v.size_bytes) {
                console.error(`::error::${k} is missing its artifact, checksum or size`);
                process.exit(1);
              }
            }
            if (process.env.GITHUB_EVENT_NAME !== "push") {
              if (!m.changelog_url || /\/releases\/tag\/player-v/.test(m.changelog_url)) {
                console.error("::error::a dispatched run's changelog_url must not point at a player-v tag; there is no tag");
                process.exit(1);
              }
              if (!/\/actions\/runs\/\d+$/.test(m.changelog_url)) {
                console.error("::error::a dispatched run's changelog_url must be the workflow run that built this publish");
                process.exit(1);
              }
            } else if (!new RegExp("/releases/tag/player-v" + process.env.VERSION + "$").test(m.changelog_url)) {
              console.error("::error::a tag push's changelog_url must be the player-v tag release");
              process.exit(1);
            }
            console.log("manifest complete:", Object.keys(m.platforms).join(", "), "changelog:", m.changelog_url);
          '

      - name: Upload to R2
        working-directory: dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ env.R2_BUCKET }}
          PREFIX: ${{ env.R2_PREFIX }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so downloads.eustress.dev cannot serve this release."
            exit 1
          fi

          # wrangler, not the S3 API, as in release.yml: one credential shape
          # for every Cloudflare interaction, and --remote so a typo cannot
          # quietly write to local simulated storage instead.
          # A 403 is the token, not the file. The step says so in the log.
          r2_put() {
            local log status
            log=$(mktemp)
            npx --yes wrangler@4 r2 object put "$@" >"$log" 2>&1 && status=0 || status=$?
            cat "$log"
            if [ "$status" -ne 0 ]; then
              if grep -q '403' "$log"; then
                echo "::error::Upload to R2 was refused (HTTP 403). CLOUDFLARE_API_TOKEN needs R2 Object Read & Write on the eustress-downloads bucket."
              fi
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
          }

          for f in *; do
            [ "$f" = "latest.json" ] && continue
            echo "uploading $f -> ${BUCKET}/${PREFIX}/v${VERSION}/${f}"
            r2_put "${BUCKET}/${PREFIX}/v${VERSION}/${f}" \
              --file "$f" --remote
          done

          # The path the website polls (player/latest.json, or
          # staging/player/latest.json). Short cache: a release must be
          # visible in minutes, not in an hour. This is the only latest.json
          # this run writes.
          echo "uploading latest.json -> ${BUCKET}/${PREFIX}/latest.json"
          r2_put "${BUCKET}/${PREFIX}/latest.json" \
            --file latest.json --remote \
            --content-type application/json \
            --cache-control "public, max-age=60"

      - name: Verify the release is actually served
        run: |
          # Uploading is not the same as being reachable. Each check below
          # goes through the Worker by a different route.

          # 1. The manifest names this version.
          URL="${DOWNLOAD_BASE}/latest.json"
          SERVED=""
          for i in 1 2 3 4 5; do
            SERVED=$(curl -fsS "$URL" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).version)}catch{console.log("")}})' || true)
            [ "$SERVED" = "$VERSION" ] && break
            echo "attempt ${i}: served '${SERVED}', want '${VERSION}' - retrying"
            sleep 10
          done
          if [ "$SERVED" != "$VERSION" ]; then
            echo "::error::${URL} is not serving ${VERSION}. The upload reported success, so check that the deployed Worker has the ${R2_PREFIX}/ routes and the bucket binding."
            exit 1
          fi
          echo "OK: ${URL} serves ${SERVED}"

          # 2. The artifact route returns the uploaded bytes: the checksums
          #    file comes back identical to the one computed above.
          if ! curl -fsS "${DOWNLOAD_BASE}/v${VERSION}/checksums.txt" -o served-checksums.txt; then
            echo "::error::${DOWNLOAD_BASE}/v${VERSION}/checksums.txt is not served. The manifest is, so check the Worker's ${R2_PREFIX}/vX.Y.Z/ route."
            exit 1
          fi
          if ! cmp -s served-checksums.txt dist/checksums.txt; then
            echo "::error::${DOWNLOAD_BASE}/v${VERSION}/checksums.txt does not match the checksums this run uploaded."
            exit 1
          fi
          echo "OK: artifacts are served from ${DOWNLOAD_BASE}/v${VERSION}/"

          # 3. Every permanent per-platform link leads to this release's file.
          FAILED=0
          for p in $(node -e 'console.log(Object.keys(require("./dist/latest.json").platforms).join(" "))'); do
            WANT=$(node -e "console.log(require('./dist/latest.json').platforms['$p'].url)")
            GOT=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "${DOWNLOAD_BASE}/latest/${p}" || true)
            if [ "$GOT" = "302 ${WANT}" ]; then
              echo "OK: ${DOWNLOAD_BASE}/latest/${p} -> ${WANT}"
            else
              echo "::error::${DOWNLOAD_BASE}/latest/${p} answered '${GOT}', want '302 ${WANT}'"
              FAILED=1
            fi
          done
          exit "$FAILED"

      # A tag push only, and never staging. A dispatched run republishes to
      # R2 from a branch, which has no tag to attach a release to. Staging
      # writes staging/player and stops. Never marked Latest, which stays
      # Studio's.
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && needs.version.outputs.release_channel != 'staging'
        with:
          name: Eustress Player v${{ needs.version.outputs.version }}
          files: dist/*
          make_latest: "false"
          generate_release_notes: true
          body: |
            ## Verify your download

            Every artifact is built from this tag by GitHub Actions and
            published with a SHA-256 checksum.

            ```
            # Windows (PowerShell)
            Get-FileHash .\EustressPlayer-Setup.exe -Algorithm SHA256

            # macOS / Linux
            shasum -a 256 eustress-player-*.tar.gz
            ```

            Compare against `checksums.txt` in this release.
