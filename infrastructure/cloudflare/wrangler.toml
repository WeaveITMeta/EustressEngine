# =============================================================================
# Eustress Downloads Worker Configuration
# =============================================================================
# Deploy: cd infrastructure/cloudflare && wrangler deploy
# =============================================================================

name = "eustress-downloads"
main = "download-worker.js"
compatibility_date = "2024-01-01"

# One host. `downloads.eustress.dev` is this worker, backed by the
# `eustress-downloads` R2 bucket, with the gate applied PER ROUTE.
#
# There used to be a second host, `releases.eustress.dev`, for one real reason:
# the shipped updater fetches the manifest and the artifact it names WITHOUT an
# Authorization header, so routing it at a uniformly JWT-gated worker would 401
# every auto-update in the field. That reasoning was correct; the remedy was
# not. The second host was never added to DNS and its bucket was never created,
# so seven release runs uploaded into nothing and no client could ever update.
#
# Per-route gating gets the same property from one name:
#   public   /latest.json, /latest/<platform>, /vX.Y.Z/<file>
#   JWT      /api/releases/download
# The gated route stays for the website's sign-in flow, where it buys
# attribution and per-user analytics rather than secrecy. The build is free
# through either path.
#
# Do not recreate `releases.eustress.dev`.
routes = [
    { pattern = "downloads.eustress.dev/*", zone_name = "eustress.dev" },
]

# R2 bucket binding
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "eustress-downloads"

# Analytics Engine binding (create in dashboard first)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "eustress_downloads"

# Environment variables
[vars]
ENVIRONMENT = "production"
