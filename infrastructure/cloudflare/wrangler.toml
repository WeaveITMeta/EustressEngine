# =============================================================================
# Eustress Downloads Worker Configuration
# =============================================================================
# Deploy: cd infrastructure/cloudflare && wrangler deploy
# =============================================================================

name = "eustress-downloads"
main = "download-worker.js"
compatibility_date = "2024-01-01"

# Custom domains.
#
# `downloads.eustress.dev` is this worker: an auth-gated (JWT) PLAYER download
# channel backed by the `eustress-downloads` R2 bucket.
#
# `releases.eustress.dev` is deliberately NOT routed here. The shipped engine
# updater (`updater.rs`) fetches `https://releases.eustress.dev/latest.json` and
# the artifact it names WITHOUT any Authorization header, so routing it through
# this JWT-gated worker would 401 every auto-update in the field. Instead,
# `releases.eustress.dev` must be a PUBLIC R2 custom domain attached directly to
# the `eustress-releases` bucket (Cloudflare dashboard -> R2 -> eustress-releases
# -> Settings -> Public access -> Custom domain). See RELEASE.md and the security
# runbook. Do NOT re-add a `releases.eustress.dev` route to this worker.
routes = [
    { pattern = "downloads.eustress.dev/*", zone_name = "eustress.dev" },
]

# R2 bucket binding
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "eustress-downloads"

# Analytics Engine binding (create in dashboard first)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "eustress_downloads"

# Environment variables
[vars]
ENVIRONMENT = "production"
