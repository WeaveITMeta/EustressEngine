# =============================================================================
# Eustress Downloads Worker Configuration
# =============================================================================
# Deploy: cd infrastructure/cloudflare && wrangler deploy
# =============================================================================

name = "eustress-downloads"
main = "download-worker.js"
compatibility_date = "2024-01-01"

# Custom domains.
#
# `releases.eustress.dev` is the host the shipped engine checks for updates —
# `updater.rs` carries `https://releases.eustress.dev/latest.json` as a compiled
# constant, so it is fixed in every copy already in the field. It is declared as
# a custom domain so Cloudflare creates and manages the DNS record itself.
#
# `downloads.eustress.dev` is the human-facing host and stays as it is.
routes = [
    { pattern = "downloads.eustress.dev/*", zone_name = "eustress.dev" },
    { pattern = "releases.eustress.dev", custom_domain = true },
]

# R2 bucket binding
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "eustress-downloads"

# Analytics Engine binding (create in dashboard first)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "eustress_downloads"

# Environment variables
[vars]
ENVIRONMENT = "production"
