name = "eustress-api"
main = "src/index.js"
compatibility_date = "2026-04-01"

# Route: api.eustress.dev/*
# Set this up in Cloudflare Dashboard after first deploy:
#   Workers Routes → Add Route → api.eustress.dev/* → eustress-api

# KV namespaces
[[kv_namespaces]]
binding = "USERS"
id = "58a7c318344d41fa8cfce36bc18ae763"

[[kv_namespaces]]
binding = "CHALLENGES"
id = "be98270d8e594722bed1508f11176fab"

[[kv_namespaces]]
binding = "KYC_STATUS"
id = "2a5efced14784736a8a1cc5368e72395"

[[kv_namespaces]]
binding = "SOCIAL"
id = "0e94f37a45eb49fea4defc9ba38dc46b"

[[kv_namespaces]]
binding = "INVENTORY"
id = "4ba9409d9b4d4175a6dcecabd697ac99"

[[kv_namespaces]]
binding = "SCREENING"
id = "3fc01ee7305c4c4ca5be6b14b74d6d53"

[[kv_namespaces]]
binding = "AUDIT_LOG"
id = "276638d8157344589cd2a82d4f1865bb"

[[kv_namespaces]]
binding = "PAYOUTS"
id = "c1d7016c782641aeba8662e2fa08b28b"

# Engine usage telemetry - anonymous tool-click aggregates + feedback
# comments (see handleTelemetryUsage/Comment/Summary in src/index.js).
[[kv_namespaces]]
binding = "TELEMETRY"
id = "750bd5aed0d64667af72534b60ffb97e"

[[kv_namespaces]]
binding = "WORKSHOP_CONTEXT"
id = "44abf849a950492c8699a3fd3b7e3c27"

# Web analytics counters (pageviews + cookieless uniques) feeding /api/admin/stats.
# The /api/analytics/hit beacon and /api/admin/stats both no-op gracefully until
# this is bound, so deploys are safe with it commented out. To enable:
#   1) npx wrangler kv namespace create ANALYTICS
#   2) paste the printed id below and uncomment this block
#   3) (optional) npx wrangler secret put ANALYTICS_SALT   # rotates the visitor hash
#   4) npx wrangler deploy
# [[kv_namespaces]]
# binding = "ANALYTICS"
# id = "PASTE_ANALYTICS_NAMESPACE_ID_HERE"

# R2 bucket for KYC documents (global, jurisdiction prefix in object key)
[[r2_buckets]]
binding = "KYC_BUCKET"
bucket_name = "eustress-kyc-documents"

# R2 bucket for published Universes, Spaces, thumbnails and Website manifests.
#
# This is the ONLY worker that touches this bucket. eustress-simulations bound
# the same bucket as SIMULATIONS under a different key layout and was retired
# without ever being reachable; see infrastructure/cloudflare/simulations/README.md.
#
#   universes/{id}/universe.pak            published Universe package
#   universes/{id}/spaces/{name}.pak       a single published Space
#   universes/{id}/website-manifest.json   the Website manifest, plus its
#                                          publish hash and auth-key digest in
#                                          customMetadata
#   universes/{id}/moderation/dossier.json the engine-built moderation dossier
#                                          (text digest of the Space) Jev reads
#   universes/{id}/moderation/capture-N.{ext}
#                                          the publish-time capture set the
#                                          Guardian Policy judge looks at
#   thumbnails/{id}/thumb.{ext}            gallery thumbnail
#   ledger-backups/{date}.json             nightly ledger snapshot
#
# The simulation listing record is NOT here. It lives in KV as SOCIAL:sim:{id},
# and the Website manifest is deliberately a separate object so a publish can
# never overwrite the record that puts a Space in the marketplace.
#
# Moderation state lives in KV beside the listing (see src/moderation.mjs):
#   SOCIAL:modcase:{sim_id}                the case record (signals, Jev
#                                          answers, judge verdict, history)
#   SOCIAL:modq:{status}:{sim_id}          queue index per status
#   SOCIAL:modroot:{author}:{etag}:{size}  dedup: a decided .pak by R2 identity
#   SOCIAL:modrate:{author}:{date}         publishes per author per day
#   USERS:publish-frozen:{author}          set by a quarantine, cleared by a
#                                          human release; blocks new publishes
[[r2_buckets]]
binding = "SCENES"
bucket_name = "eustress-simulations"

# Rate limiter for website manifest reads, keyed on the consumer's auth key.
#
# The native binding rather than a KV counter: KV allows ONE WRITE PER SECOND to
# the same key, so a counter incremented on every request throttles itself at
# exactly the rate it exists to measure, then undercounts and under-enforces.
# A limiter that looks present and is not is the worst of the options.
#
# 120 per 60s clears well over a thousand manifests in ten minutes, which covers
# a large catalogue refreshing at deploy. The limit is per Cloudflare location
# and eventually consistent: cost control and abuse damping, not an accounting
# system, and never a quota anyone is billed against.
[[ratelimits]]
name = "MANIFEST_RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 120
  period = 60

# Namespace index for Website manifests lives in the SOCIAL namespace above:
#   website-ns:{namespace}  -> { sim_id, owner_id, claimed_at, ... }
#   website-ns-of:{sim_id}  -> namespace
# It exists because R2 has no secondary index, and it is what lets a website
# hardcode {namespace}/latest instead of a UUID that changes on every publish.

# Secrets (set via wrangler secret put):
# JWT_SECRET            - persistent JWT signing key
# GROK_API_KEY          - xAI Grok API key for AI-enhanced search, KYC, and the
#                         moderation judge + agent
# JEV_API_KEY           - TypeSafe AI Jev key: the moderation triage classifier
#                         (docs/architecture/MODERATION_PIPELINE.md). Set with
#                           npx wrangler secret put JEV_API_KEY
#                         For `wrangler dev`, put it in a .dev.vars file next to
#                         this config (gitignored). The engine never holds it:
#                         classification runs here, on the uploaded artifact.
# STRIPE_SECRET_KEY     - Stripe secret key for payments + Connect
# STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret

# Optional Workers AI binding. With it bound and JEV_API_KEY unset, the
# moderation classifier runs Jev through Workers AI (`typesafe/jev`), billed to
# this Cloudflare account. The direct key is preferred when both exist.
# [ai]
# binding = "AI"

# Commerce (src/commerce.mjs): microtransactions inside published simulations.
# Durable Objects rather than KV because money and ordering need what KV cannot
# give: KV has no compare-and-set and is eventually consistent between
# locations.
#
#   WALLETS        one Wallet per account: the authoritative Ticket balance
#                  (opened from USERS user:{id}.ticket_balance, then copied to
#                  USERS ticketbal:{id} for display), idempotency keys, passes owned,
#                  receipts awaiting fulfillment, and an alarm-retried outbox
#                  that finishes each purchase.
#   COMMERCE_HUBS  one CommerceHub per creator: products, sales, events (30
#                  days), webhook endpoints and deliveries, the `listen`
#                  stream, API keys, and each sale's deferred value score.
#
# API keys are indexed in USERS as apikey:{sha256 of the key}.
#
# Webhook deliveries POST to URLs creators supply, through the global fetch,
# which reaches only the public internet. Keep them off any binding's fetch
# (service, VPC service, Tunnel): see cleanWebhookUrl in src/commerce.mjs.
[[durable_objects.bindings]]
name = "WALLETS"
class_name = "Wallet"

[[durable_objects.bindings]]
name = "COMMERCE_HUBS"
class_name = "CommerceHub"

[[migrations]]
tag = "v1-commerce"
new_sqlite_classes = ["Wallet", "CommerceHub"]

# Treasury (src/treasury.mjs): the USD pool contributors are paid from, in
# integer cents, with every deposit, refund, dispute and payout keyed by its
# source so a repeat changes nothing. The same object runs each night's
# settlement (the BLS emission, the USD drip, the ledger backup) in bounded
# steps on its alarm. One instance, named "treasury".
[[durable_objects.bindings]]
name = "TREASURY"
class_name = "Treasury"

[[migrations]]
tag = "v2-treasury"
new_sqlite_classes = ["Treasury"]

# Live hosts (src/live.mjs): who is hosting each published simulation right
# now and the join link they advertise, fed by Studio's heartbeat while it
# hosts and read by the listing's Live indicator. One instance per simulation
# id; its alarm clears a host whose heartbeat stopped. A Durable Object rather
# than KV, whose Free plan allows 1,000 writes a day against one host's 2,880
# heartbeats. See docs/launch/GOAL_LIVE_GALLERY_PLAY.md (M3).
[[durable_objects.bindings]]
name = "LIVE_HOSTS"
class_name = "LiveHost"

[[migrations]]
tag = "v3-live-hosts"
new_sqlite_classes = ["LiveHost"]

# Guest allowances (src/guest.mjs): one object per guest id, which is a keyed
# hash of a network address and the UTC day. It holds the simulations started
# and the seconds played that day and deletes itself 25 hours after the day
# began. A Durable Object because the allowance needs atomic updates that KV
# cannot give. See docs/architecture/GUEST_PLAY.md.
[[durable_objects.bindings]]
name = "GUEST_ALLOWANCE"
class_name = "GuestAllowance"

[[migrations]]
tag = "v4-guest"
new_sqlite_classes = ["GuestAllowance"]

# Cosign claims per account. The engine sends at most 6 claims per 5-minute
# flush; this only meets a script. Per Cloudflare location, like the manifest
# limiter above.
[[ratelimits]]
name = "COSIGN_RATE_LIMITER"
namespace_id = "2002"

  [ratelimits.simple]
  limit = 30
  period = 60

# The author notification feed (/api/notifications, its read marks and email
# prefs), keyed on the account. Studio polls it while a review is pending, so
# 60 per minute is generous for a person and a ceiling for a loop.
[[ratelimits]]
name = "NOTIFY_RATE_LIMITER"
namespace_id = "2003"

  [ratelimits.simple]
  limit = 60
  period = 60

# The unauthenticated auth routes (/api/auth/register, /challenge and
# /verify-challenge), keyed on the caller's address. A sign-in is two calls and a
# registration a few more, so 30 a minute leaves a household or an office
# behind one address plenty of room, and stops a loop that mints accounts or
# fills the challenge store. Per Cloudflare location, like the limiters above.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2004"

  [ratelimits.simple]
  limit = 30
  period = 60

# Hourly: each run makes sure yesterday's settlement has started (a repeat
# does nothing); the midnight run also refreshes the model catalog and sweeps
# moderation. See scheduled() in src/index.js.
[triggers]
crons = ["0 * * * *"]

# Email Workers - send identity backup emails from identity@eustress.dev
# Requires Email Routing enabled on eustress.dev in Cloudflare dashboard
[[send_email]]
name = "EMAIL"

[vars]
FORK_ID = "eustress.dev"
# Optional JSON overriding any key of DEFAULT_THRESHOLDS in src/moderation.mjs,
# for example '{"hard_hold":0.30,"audit_rate":0.05}'. Unknown keys and
# non-numeric values are ignored; the defaults are the calibrated baseline.
# MODERATION_THRESHOLDS = ""

# ---------------------------------------------------------------------------
# STAGING (2026-09-26): `npx wrangler deploy --env staging` deploys the Worker
# "eustress-api-staging" at api-staging.eustress.dev with its OWN empty storage
# and its own secrets (set with `npx wrangler secret put <NAME> --env staging`).
# Nothing here touches production. Bindings are not inherited, so each is
# restated with the staging resources.
# ---------------------------------------------------------------------------
[env.staging]
name = "eustress-api-staging"
routes = [{ pattern = "api-staging.eustress.dev", custom_domain = true }]

[[env.staging.kv_namespaces]]
binding = "USERS"
id = "b6602c578a864bc1b8418b1fcfca58c3"

[[env.staging.kv_namespaces]]
binding = "CHALLENGES"
id = "fc253d01fff84a80a260db8db1f66236"

[[env.staging.kv_namespaces]]
binding = "KYC_STATUS"
id = "686d497f602949db96ec5711d9d26bd0"

[[env.staging.kv_namespaces]]
binding = "SOCIAL"
id = "eb7cc0f9f10d4591a7e24da6e0402480"

[[env.staging.kv_namespaces]]
binding = "INVENTORY"
id = "d919334c29514a60b8518f2fa999c395"

[[env.staging.kv_namespaces]]
binding = "SCREENING"
id = "e0e4f183704e43feb58b853ad17475ba"

[[env.staging.kv_namespaces]]
binding = "AUDIT_LOG"
id = "960baf7cde37422783d2cd98451688d5"

[[env.staging.kv_namespaces]]
binding = "PAYOUTS"
id = "5ac0117848584f34b9e5da8acda01a48"

[[env.staging.kv_namespaces]]
binding = "TELEMETRY"
id = "0a449051aa384ed0bacceeb7a50784f0"

[[env.staging.kv_namespaces]]
binding = "WORKSHOP_CONTEXT"
id = "239b860725f0424e9a9ae90df510cc0a"

[[env.staging.r2_buckets]]
binding = "KYC_BUCKET"
bucket_name = "eustress-kyc-documents-staging"

[[env.staging.r2_buckets]]
binding = "SCENES"
bucket_name = "eustress-simulations-staging"

[[env.staging.ratelimits]]
name = "MANIFEST_RATE_LIMITER"
namespace_id = "3001"
  [env.staging.ratelimits.simple]
  limit = 120
  period = 60

[[env.staging.ratelimits]]
name = "COSIGN_RATE_LIMITER"
namespace_id = "3002"
  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.ratelimits]]
name = "NOTIFY_RATE_LIMITER"
namespace_id = "3003"
  [env.staging.ratelimits.simple]
  limit = 60
  period = 60

[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "3004"
  [env.staging.ratelimits.simple]
  limit = 30
  period = 60

[[env.staging.durable_objects.bindings]]
name = "WALLETS"
class_name = "Wallet"

[[env.staging.durable_objects.bindings]]
name = "COMMERCE_HUBS"
class_name = "CommerceHub"

[[env.staging.durable_objects.bindings]]
name = "TREASURY"
class_name = "Treasury"

[[env.staging.durable_objects.bindings]]
name = "LIVE_HOSTS"
class_name = "LiveHost"

[[env.staging.migrations]]
tag = "v1-commerce"
new_sqlite_classes = ["Wallet", "CommerceHub"]

[[env.staging.migrations]]
tag = "v2-treasury"
new_sqlite_classes = ["Treasury"]

[[env.staging.migrations]]
tag = "v3-live-hosts"
new_sqlite_classes = ["LiveHost"]

[[env.staging.durable_objects.bindings]]
name = "GUEST_ALLOWANCE"
class_name = "GuestAllowance"

[[env.staging.migrations]]
tag = "v4-guest"
new_sqlite_classes = ["GuestAllowance"]

[[env.staging.send_email]]
name = "EMAIL"

[env.staging.vars]
FORK_ID = "eustress.dev"
# Links in review emails (unsubscribe, review details). Production defaults to
# api.eustress.dev and eustress.dev in src/moderation.mjs.
PUBLIC_API_ORIGIN = "https://api-staging.eustress.dev"
# The staging website: Pages branch "staging" of the project "eustress". Its
# alias is stable across deployments, unlike the per-deployment
# <hash>.eustress-cbb.pages.dev hosts, which stay unlisted.
PUBLIC_SITE_ORIGIN = "https://staging.eustress-cbb.pages.dev"
# Browser origins admitted besides eustress.dev and localhost:3000: exact
# origins, comma separated, no wildcards (src/cors.mjs). Production sets none.
ALLOWED_ORIGINS = "https://staging.eustress-cbb.pages.dev"
