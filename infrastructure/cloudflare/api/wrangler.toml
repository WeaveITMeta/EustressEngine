[env.staging.vars]
# An administrator may replace a key here (src/identity_routes.mjs). Production leaves it unset.
ADMIN_REPLACE_KEY_ENABLED = "true"
FORK_ID = "eustress.dev"
LOGIN_ORIGINS = "https://api-staging.eustress.dev"
# Passkeys on the staging site only: a staging passkey never signs in to production.
PASSKEY_RP_ID = "staging.eustress-cbb.pages.dev"
PASSKEY_ORIGINS = "https://staging.eustress-cbb.pages.dev"
# Links in review emails (unsubscribe, review details). Production defaults to
# api.eustress.dev and eustress.dev in src/moderation.mjs.
PUBLIC_API_ORIGIN = "https://api-staging.eustress.dev"
# The staging website: Pages branch "staging" of the project "eustress". Its
# alias is stable across deployments, unlike the per-deployment
# <hash>.eustress-cbb.pages.dev hosts, which stay unlisted.
PUBLIC_SITE_ORIGIN = "https://staging.eustress-cbb.pages.dev"
# Browser origins admitted besides eustress.dev and localhost:3000: exact
# origins, comma separated, no wildcards (src/cors.mjs). Production sets none.
ALLOWED_ORIGINS = "https://staging.eustress-cbb.pages.dev"
# Dedicated-server credentials (src/live.mjs handleServerCredential) are stored
# in SOCIAL as srvcred:<sha256>, one current hash per listing at
# srvcred-sim:<id>. No extra binding and no secret: the author mints the
# token with a session, and the server presents it on /live. Do not deploy
# this file from a change that only adds the credential; staging deploy is a
# separate, explicit step.
