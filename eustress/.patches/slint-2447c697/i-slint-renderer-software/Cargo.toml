#
# EUSTRESS: i-slint-renderer-software 1.17.1 from slint-ui/slint at
# 2447c697327e7f87c5044af229e0be6c18608fcc (`internal/renderers/software`), with
# two functions patched in lib.rs. See ../PATCH.md. The fields Slint inherits
# from its workspace are written out, and the two Slint crates it uses come
# from the same git source as the rest of the graph, so only this crate is
# replaced.

[package]
name = "i-slint-renderer-software"
description = "Slint's Software renderer implementation"
authors = ["Slint Developers <info@slint.dev>"]
edition = "2024"
homepage = "https://slint.dev"
license = "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0"
repository = "https://github.com/slint-ui/slint"
rust-version = "1.92"
version = "1.17.1"

[lib]
path = "lib.rs"

[features]
systemfonts = [
  "i-slint-core/shared-fontique",
  "i-slint-common/shared-fontique",
  "dep:skrifa",
  "dep:swash",
  "i-slint-core/shared-parley",
  "i-slint-core/shared-swash",
  "std",
  "dep:clru",
]
path = ["dep:zeno", "dep:lyon_path", "i-slint-core/path"]
std = ["zeno?/std", "num-traits/std", "euclid/std", "i-slint-core/std", "path", "systemfonts", "swash?/std"]
libm = ["zeno?/libm", "num-traits/libm", "euclid/libm", "i-slint-core/libm", "swash?/libm"]

experimental = []
# Exposes additional APIS that aren't public but required for integration testing.
testing = ["i-slint-core/testing"]
default = ["std"]

[dependencies]
i-slint-core = { git = "https://github.com/slint-ui/slint", branch = "master", version = "=1.17.1", default-features = false }
i-slint-common = { git = "https://github.com/slint-ui/slint", branch = "master", version = "=1.17.1", default-features = false }
bytemuck = { version = "1.13.1", features = ["derive"] }
clru = { version = "0.6.0", optional = true }
derive_more = { version = "2.0.0", default-features = false, features = ["deref", "deref_mut", "into", "from", "add", "add_assign", "mul", "not", "display", "error"] }
euclid = { version = "0.22.1", default-features = false }
integer-sqrt = { version = "0.1.5" }
num-traits = { version = "0.2", default-features = false }
skrifa = { version = "0.43", optional = true }
swash = { version = "0.2.7", default-features = false, optional = true, features = ["scale", "render"] }
zeno = { version = "0.3.3", optional = true, default-features = false, features = ["eval"] }
lyon_path = { version = "1.0", default-features = false, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cbindgen)", "cfg(slint_nightly_test)"] }
