[package]
name = "eustress-bridge-client"
version = "0.1.0"
edition = "2021"
description = "Synchronous std-only client for the engine's TCP JSON-RPC Engine Bridge. Shared by the MCP server and the eustress CLI so both drive a live engine or eustress-headless the same way."
authors = ["EustressEngine Contributors"]
license = "PolyForm-Shield-1.0.0"

[dependencies]
# The wire format is JSON-RPC over newline-delimited JSON. Deliberately
# std-only for transport (TcpStream, no tokio) so this stays a near-zero-cost
# add for any consumer, matching the CLI's and eustress-space's minimal-deps
# policy.
serde_json = { workspace = true }
# `InstanceRecord` — the one shared definition of a running engine instance,
# written by the engine and read by the CLI/MCP server.
serde = { workspace = true }
# OneDrive-safe documents root for the default workspace (mirrors the
# engine's `space::default_documents_root`).
dirs = { workspace = true }
