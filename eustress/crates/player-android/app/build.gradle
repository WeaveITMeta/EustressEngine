// Phase 0 spike. No Kotlin. Native code is the cargo-ndk cdylib in jniLibs.

plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.eustress.player'
    compileSdk 34

    defaultConfig {
        applicationId "dev.eustress.player"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.2.0-parity"

        ndk {
            // arm64-v8a is the spike artifact. An emulator check can pass
            // -PeustressAbi=x86_64 (or a comma-separated list).
            def eustressAbi = findProperty('eustressAbi') ?: 'arm64-v8a'
            eustressAbi.toString().split(',').each { abi ->
                abiFilters abi.trim()
            }
        }
    }

    // One debug key for every machine. The default ~/.android/debug.keystore
    // is generated per host, so a phase0 APK and a parity APK would not
    // install over each other. Password and alias are the Android debug
    // convention. This key is not a release key.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def bundledAssets = layout.buildDirectory.dir("generated/bundledAssets")
    tasks.register('copyCharacterGlbs', Copy) {
        from('../../common/assets/characters') {
            include '**/*.glb'
        }
        into bundledAssets.map { it.dir('bundled/characters') }
        includeEmptyDirs = false
    }
    // Primitive parts load `parts/block.glb` (and the other shapes) from the
    // default asset source. On Android that source is the APK AssetManager,
    // so the file has to sit at assets/parts/block.glb. Characters stay under
    // assets/bundled/characters for `bundled://`.
    tasks.register('copyPartGlbs', Copy) {
        from('../../common/assets/parts') {
            include '**/*.glb'
        }
        into bundledAssets.map { it.dir('parts') }
        includeEmptyDirs = false
    }

    sourceSets {
        main {
            // emulator-jni holds x86_64/wrap.sh (WGPU_BACKEND=gl). AGP
            // packages only .so from jniLibs; the spike APK gets wrap.sh
            // from a zip after packageDebug. See PHASE0_SPIKE.md.
            jniLibs.srcDirs = ['src/main/jniLibs', 'src/emulator-jni']
            assets.srcDir(bundledAssets)
        }
    }
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
        dependsOn 'copyCharacterGlbs', 'copyPartGlbs'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
            details.because 'games-activity 2.0.2 and appcompat disagree on kotlin-stdlib'
        }
    }
}

dependencies {
    // games-activity 2.0.2's POM lists no dependencies, but GameActivity
    // extends AppCompatActivity. No app code; this is the support library.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Must match android-activity 0.6.1 (Bevy 0.19). 2.0.2's Java
    // onTouchEventNative signature does not match the native glue.
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.security:security-crypto:1.1.0'
}
