[package]
name = "eustress-networking"
version = "0.2.0"
edition = "2021"
description = "Eustress multiplayer: the wire protocol, the Bevy session layer, and the native WebTransport host and player."
authors = ["EustressEngine Contributors"]
license = "PolyForm-Shield-1.0.0"

# Layering, so a browser build can drop the native transport without undoing
# anything else:
#
#   wire, join_link, session   IO-free. No tokio, no threads, no filesystem,
#                              no std::time. They talk to a transport only
#                              through crossbeam channels of opaque frames.
#   native                     Desktop IO: a WebTransport host and player over
#                              wtransport (HTTP/3 on quinn, rustls on ring).
#                              Behind the `native` feature and never compiled
#                              for wasm32.
#
# WebTransport rather than raw QUIC because a browser can only open
# WebTransport. One listener, one certificate and one pinning scheme then serve
# the desktop Player and a future browser Player alike.

[dependencies]
# The input lane samples the keyboard, the mouse and gamepads (session.rs
# send_local_input): each is a bevy_input feature, declared here so the crate
# builds in any graph, not only where another crate happens to turn them on.
bevy = { workspace = true, features = ["serialize", "keyboard", "mouse", "gamepad"] }

serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
crossbeam-channel = "0.5"
tracing = "0.1"
thiserror = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }

# The .echk chunk container. Storage-free, so a player never links Fjall.
eustress-echk = { path = "../../echk" }

# Avatar runtime types (SpawnAvatar, AvatarIntent, AvatarLocomotion) live in
# `eustress_common::avatar`, which needs `physics`. Default features stay off so
# this crate does not pull `streaming` (tokio fs + multi-thread) into a browser
# build; the Studio and Player shells enable their own feature sets.
eustress-common = { path = "..", default-features = false, features = ["physics"] }

# ── Native transport ────────────────────────────────────────────────────────
# Same quinn 0.11 / rustls 0.23 on ring / rcgen 0.13 stack the engine already
# links, so nothing compiles twice. `dangerous-configuration` exists for one
# case only: joining a host on loopback without a certificate pin. `quinn`
# exposes the QUIC transport settings, for the packet size cap in `native`.
wtransport = { version = "0.6.1", default-features = false, features = ["self-signed", "ring", "dangerous-configuration", "quinn"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util"], optional = true }

[features]
default = ["native"]
native = ["dep:wtransport", "dep:tokio"]

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_winit", "bevy_pbr", "bevy_gizmos"] }

[[bench]]
name = "stress_test"
harness = false
