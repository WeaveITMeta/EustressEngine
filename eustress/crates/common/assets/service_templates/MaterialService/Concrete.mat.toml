[material]
name = "Concrete"
preset = "Concrete"
description = "Cast concrete with fine aggregate, bug holes and the odd hairline crack"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 0.0
roughness = 1.0
reflectance = 0.5

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/concrete_base_color.png"
normal = "materials/textures/concrete_normal.png"
metallic_roughness = "materials/textures/concrete_metallic_roughness.png"
occlusion = "materials/textures/concrete_metallic_roughness.png"
