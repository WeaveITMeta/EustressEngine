[material]
name = "Ice"
preset = "Ice"
description = "Clear lake ice with fractures, trapped bubbles and patches of frost"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 0.0
roughness = 1.0
reflectance = 0.35

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/ice_base_color.png"
normal = "materials/textures/ice_normal.png"
metallic_roughness = "materials/textures/ice_metallic_roughness.png"
occlusion = "materials/textures/ice_metallic_roughness.png"
