[material]
name = "Slate"
preset = "Slate"
description = "Natural cleft slate: dark blue-grey laminae with ragged split edges"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 0.0
roughness = 1.0
reflectance = 0.5

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/slate_base_color.png"
normal = "materials/textures/slate_normal.png"
metallic_roughness = "materials/textures/slate_metallic_roughness.png"
occlusion = "materials/textures/slate_metallic_roughness.png"
