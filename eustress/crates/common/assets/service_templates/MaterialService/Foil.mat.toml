[material]
name = "Foil"
preset = "Foil"
description = "Crumpled aluminium foil: bright, smooth facets folded at sharp creases"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 1.0
roughness = 1.0
reflectance = 0.5

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/foil_base_color.png"
normal = "materials/textures/foil_normal.png"
metallic_roughness = "materials/textures/foil_metallic_roughness.png"
occlusion = "materials/textures/foil_metallic_roughness.png"
