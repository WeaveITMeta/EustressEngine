[material]
name = "Fabric"
preset = "Fabric"
description = "Heavy plain-weave cloth with slubbed, heathered threads"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 0.0
roughness = 1.0
reflectance = 0.35

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/fabric_base_color.png"
normal = "materials/textures/fabric_normal.png"
metallic_roughness = "materials/textures/fabric_metallic_roughness.png"
occlusion = "materials/textures/fabric_metallic_roughness.png"
