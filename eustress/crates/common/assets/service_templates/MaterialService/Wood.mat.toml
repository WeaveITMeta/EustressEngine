[material]
name = "Wood"
preset = "Wood"
description = "Solid wood: edge-glued staves, flat- and rift-sawn grain, oiled"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 0.0
roughness = 1.0
reflectance = 0.5

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/wood_base_color.png"
normal = "materials/textures/wood_normal.png"
metallic_roughness = "materials/textures/wood_metallic_roughness.png"
occlusion = "materials/textures/wood_metallic_roughness.png"
