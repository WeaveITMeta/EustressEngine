[material]
name = "CorrodedMetal"
preset = "CorrodedMetal"
description = "Weathered steel: flaking rust over pitted mill scale, with run-off streaks"

# The maps carry colour, roughness, metalness and occlusion; these factors multiply them.
[pbr]
base_color = [1.0, 1.0, 1.0, 1.0]
metallic = 1.0
roughness = 1.0
reflectance = 0.5

# metallic_roughness is packed glTF-style: R = occlusion, G = roughness, B = metallic.
[textures]
base_color = "materials/textures/corroded_metal_base_color.png"
normal = "materials/textures/corroded_metal_normal.png"
metallic_roughness = "materials/textures/corroded_metal_metallic_roughness.png"
occlusion = "materials/textures/corroded_metal_metallic_roughness.png"
