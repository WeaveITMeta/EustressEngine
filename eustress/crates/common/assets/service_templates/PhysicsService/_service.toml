# PhysicsService: global physics settings and simulation fidelity.
# _service.toml marks this folder as a Service and defines all editable properties.
#
# Every fidelity flag here gates systems that actually run each step. Turning one
# off stops that domain on the next step; nothing restarts. These values must
# match PhysicsService::default() in crates/common/src/services/physics.rs (a
# unit test enforces it), so a Space without this file behaves identically.

[service]
class_name = "PhysicsService"
icon = "physicsservice"
description = "Gravity, solver settings, and which physics domains step"
can_have_children = false

[properties]
# Master switch. Off stops every domain below.
enabled = true
# Metres per second squared. Eustress is metre-native.
gravity = [0.0, -9.80665, 0.0]
time_scale = 1.0
# Avian substeps per fixed step. 6 is the engine's pinned determinism value.
solver_substeps = 6

# Fidelity
kinematics = true
thermodynamics = true
chemistry = true
electricity = true
deformation = true
fluids = true
materials = true
particles = true
particle_simulation = true
nuclear = true
visualizers = true
parallel = true
