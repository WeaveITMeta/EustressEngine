# PointLight: Omni-directional light source (child of BasePart or Attachment)
# Bevy: PointLight (common/src/plugins/light_classes.rs)
#
# brightness: Roblox-style dial, display-referred (1 = a normal lamp).
# range:      reach in metres; the light fades to nothing here.

[light]
color = [255, 255, 255]
brightness = 1.0
range = 16.0
shadows = false
enabled = true

[metadata]
class_name = "PointLight"
archivable = true
