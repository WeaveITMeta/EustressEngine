# KeyframeSequence: a clip written as data. Its keyframes follow inline as
# [[keyframes]] tables (docs/design/ANIMATION_SYSTEM.md, "The clip record").
# Defaults are Roblox's: looped, at Action priority.

[keyframe_sequence]
loop = true
priority = "Action"

[metadata]
class_name = "KeyframeSequence"
archivable = true
