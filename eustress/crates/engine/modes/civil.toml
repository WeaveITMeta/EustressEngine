# Eustress Mode — "Civil".
# Civil / structural engineering: parametric drafting, terrain, data, and
# MindSpace for project note-graphs. Survey/Structures tabs are
# forward-looking (declared ahead of their tooling).

[mode]
id = "civil"
name = "Civil"
icon = "bridge"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "model", "cad", "terrain", "data", "mindspace", "test"]

[layout]
preset = "Wide Panels"

[theme]
accent = "#4ade80"

# Civil itself is NOT directly selectable in the Modes dropdown (see
# ribbon.slint's mode-row-touch handler: any mode with submodes only expands
# its submenu) — a discipline must be chosen. Submodes render in the default
# grey (like every other mode's submenu) — no per-discipline color override.
[[submodes]]
id = "structural"
name = "Structural Engineering"
icon = "truss"

[[submodes]]
id = "geotechnical"
name = "Geotechnical Engineering"
icon = "layers"

[[submodes]]
id = "transportation"
name = "Transportation Engineering"
icon = "map"

[[submodes]]
id = "water-resources"
name = "Water Resources Engineering"
icon = "water"

[[submodes]]
id = "construction-management"
name = "Construction Engineering & Management"
icon = "build"

[[submodes]]
id = "environmental"
name = "Environmental Engineering"
icon = "globe"

[[submodes]]
id = "surveying-geospatial"
name = "Surveying & Geospatial Engineering"
icon = "compass"

[[submodes]]
id = "utility"
name = "Utility Engineering"
icon = "lightning"

[[submodes]]
id = "coastal-ocean"
name = "Coastal & Ocean Engineering"
icon = "anchor"

[[tabs]]
id = "survey"
name = "Survey"
color = "#4ade80"

  # `data:overlay` had no Rust-side handler (a pre-existing dead button
  # shared with the built-in Data tab, see ribbon.slint) — dropped.
  [[tabs.sections]]
  name = "Site"
  tools = ["data:import"]

[[tabs]]
id = "structures"
name = "Structures"
color = "#60a5fa"

  [[tabs.sections]]
  name = "Analysis"
  tools = ["cstr:load_case_builder", "cstr:frame_analyzer", "cstr:moment_diagram"]

# ── Per-discipline submode_tabs — each of Civil's 9 disciplines carries the
# shared "Survey" tab (site data intake applies to all of them) plus its OWN
# discipline-flavored tab, so the ribbon genuinely differs per discipline
# instead of every one falling back to the same generic Structures tab.
# `tools = []` throughout except Survey's own already-wired `data:import` —
# none of this domain content has real dispatch yet (same honest-placeholder
# rule as Justice/Legal above). ─────────────────────────────────────────────

