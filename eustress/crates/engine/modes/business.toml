# Eustress Mode — "Business".
# Consolidates the Product and Manufacturing workflows as first-class TABS
# (per 2026-07-18 direction), plus an Operations tab for live tracking.

[mode]
id = "business"
name = "Business"
icon = "briefcase"
# Mode-selection-menu color - Roblox BrickColor Bright red (21).
color = "#C4281C"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "data", "plugins"]

[layout]
preset = "Wide Panels"

[theme]
# Matches [mode].color so the selection ring/active-tool tint reads the same
# red as the mode's own dropdown/header identity color.
accent = "#C4281C"

# Business itself is NOT directly selectable in the Modes dropdown (see
# ribbon.slint's mode-row-touch handler: any mode with submodes only expands
# its submenu) — a function must be chosen.
[[submodes]]
id = "strategy"
name = "Strategy"
icon = "crosshair"

[[submodes]]
id = "finance"
name = "Finance"
icon = "coin"

[[submodes]]
id = "accounting"
name = "Accounting"
icon = "calc"

[[submodes]]
id = "operations"
name = "Operations"
icon = "gears"

[[submodes]]
id = "supply-chain"
name = "Supply Chain"
icon = "truck"

[[submodes]]
id = "marketing"
name = "Marketing"
icon = "megaphone"

[[submodes]]
id = "entrepreneurship"
name = "Entrepreneurship"
icon = "rocket"

[[tabs]]
id = "product"
name = "Product"
color = "#60a5fa"

  [[tabs.sections]]
  name = "Planning"
  tools = ["biz:product_roadmap", "biz:feature_backlog", "biz:user_research"]

  # `data:dashboard` had no Rust-side handler (a pre-existing dead button
  # shared with the built-in Data tab, see ribbon.slint) — dropped; Chart +
  # Stats already cover this section's real functionality.
  [[tabs.sections]]
  name = "Analytics"
  tools = ["data:chart", "data:stats"]

[[tabs]]
id = "manufacturing"
name = "Manufacturing"
color = "#ff9f45"

  [[tabs.sections]]
  name = "Fabrication"
  tools = ["insert:cad_plate", "insert:cad_box", "insert:cad_cylinder", "csg:union", "csg:negate"]

  [[tabs.sections]]
  name = "Assembly"
  tools = ["cad:mate_revolute", "cad:mate_prismatic", "cad:mate_ball"]

[[tabs]]
id = "operations"
name = "Operations"
color = "#4ade80"

  [[tabs.sections]]
  name = "Tracking"
  tools = ["data:record", "data:timeline"]

# ── Per-function submode_tabs — Product and Operations are universal
# (dashboards + tracking are generically useful to any function), so both
# carry forward verbatim into every function's block, plus one new
# function-specific tab. Manufacturing (CAD/CSG fabrication) is NOT
# universal — a Finance or Marketing tab showing fabrication tools would be
# a real mismatch — so it's carried forward only into Supply Chain, where it
# genuinely applies. The "operations" SUBMODE deliberately has no
# submode_tabs entries at all below: it's already identical to the mode's
# plain fallback (Product + Manufacturing + Operations), so leaving it with
# zero overrides means it falls back to exactly that automatically. ────────

