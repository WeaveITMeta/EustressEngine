# Eustress Mode — "Legal".
# Records, discovery, and scenario work: data-forward with MindSpace for
# case-relationship graphs and a scripting layout. Case/Discovery tabs are
# forward-looking (declared ahead of their tooling).
#
# Case/Discovery expanded + Research/Draft/Clients/Metrics tabs added
# 2026-07-21 per the user's Legal ribbon pitch, whose own top design
# principle is "100% compatible, zero breaking changes" — so this pass adds
# new tabs/sections only and edits no existing tools list. Scoped down via a
# Fable-5 design consult: the pitch's "Data → Legal Analytics" expansion
# moved to a NEW "Metrics" tab instead of touching the built-in Data tab
# (Data is shared code across all nine modes — a mode manifest can't safely
# edit it, so "zero disruption" means leaving it alone). The pitch's Trial
# tab folds into Case as a single "Trial" section (mirroring how Justice's
# Civil submode already treats Trial as one Case section, for cross-mode
# consistency), and Ethics folds into Clients as one "Ethics & Conflicts"
# section, keeping the tab strip to six custom tabs instead of the pitch's
# eleven. `tools = []` throughout except where a section's purpose genuinely
# matches an already-wired `data:*` action — no synthetic buttons that look
# clickable but do nothing; see justice.toml's matching 2026-07-21 comment
# for the full reasoning (an "AI Research"-style button that appears to work
# but doesn't is a worse failure mode for a lawyer than an honest
# "Coming soon" placeholder).

[mode]
id = "legal"
name = "Legal"
icon = "scales"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "data", "mindspace", "test"]

[layout]
preset = "Scripting"

[theme]
accent = "#ffd166"

# Legal itself is NOT directly selectable in the Modes dropdown (see
# ribbon.slint's mode-row-touch handler: any mode with submodes only expands
# its submenu) — a practice area must be chosen.
[[submodes]]
id = "pre-law"
name = "Pre-Law"
icon = "book"

[[submodes]]
id = "small-business"
name = "Small Business"
icon = "briefcase"

[[submodes]]
id = "corporate"
name = "Corporate"
icon = "building"

[[submodes]]
id = "litigation"
name = "Litigation"
icon = "gavel"

[[submodes]]
id = "mediation"
name = "Mediation"
icon = "handshake"

[[submodes]]
id = "arbitration"
name = "Arbitration"
icon = "scales"

