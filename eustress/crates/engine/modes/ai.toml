# Eustress Mode - "AI".
#
# Eustress as a DATA PLATFORM for machine learning: acquire a corpus (from the
# simulation itself, from live feeds, or synthesized), curate and label it,
# prove where every record came from, train and evaluate against it, and export
# it as a HuggingFace-loadable dataset.
#
# Placed between Legal and Civil in the Modes dropdown - source order in
# `studio_modes.rs::load_builtin_modes` IS display order.
#
# HONESTY NOTE - read before wiring anything here:
# The `Corpus` tab is genuinely functional: every id in it is an already-wired
# `data:*` action (import, connect, record, grid, chart, stats, fit, fft,
# cluster, anomaly). Everything else is an aspirational "dream" button that
# records a vote and says so in a toast - the same contract the other nine
# modes follow.
#
# In particular the `hub:*` export tools are NOT yet wired, even though
# `eustress-data`'s `export::export_huggingface()` is fully implemented. The
# gap is provenance, not export: that function REFUSES to write unless handed a
# `provenance::Manifest` that passes `verify()` with no undeclared sources, and
# nothing in the engine constructs a Manifest yet. Wiring `hub:export_dataset`
# therefore means building the `prov:*` capture path first - declaring sources
# and recording per-record lineage as data is ingested. Shipping an "Export to
# HuggingFace" button that silently produced an unattributed corpus would
# defeat the entire point of that layer.

[mode]
id = "ai"
name = "AI"
icon = "brain"
# Mode-selection-menu color - matches [theme] accent below, per the rule that
# the dropdown swatch and the in-editor selection highlight are the same hue.
color = "#6366f1"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "data", "test", "mindspace", "plugins"]

[layout]
preset = "Wide Panels"

[theme]
# Indigo - deliberately distinct from Gaming's light violet (#c084fc) and
# Student's deeper blue (#0D69AC), the two nearest neighbours in the dropdown.
accent = "#6366f1"

# AI itself is NOT directly selectable (any mode with submodes only expands its
# submenu - see ribbon.slint's mode-row-touch handler); pick a discipline.

[[submodes]]
id = "acquisition"
name = "Acquisition"
icon = "radar"

[[submodes]]
id = "curation"
name = "Curation"
icon = "funnel"

[[submodes]]
id = "provenance"
name = "Provenance"
icon = "fingerprint"

[[submodes]]
id = "training"
name = "Training"
icon = "brain"

[[submodes]]
id = "reinforcement"
name = "Reinforcement"
icon = "robot"

[[submodes]]
id = "evaluation"
name = "Evaluation"
icon = "gauge"

[[submodes]]
id = "publishing"
name = "Publishing"
icon = "rocket"

