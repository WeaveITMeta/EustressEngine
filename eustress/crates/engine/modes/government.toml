# Eustress Mode — "Government".
#
# Appropriation, administration, and legislation. Deliberately NOT the
# judiciary (that is the separate "justice" MODE) and NOT civil engineering
# (that is the separate "civil" MODE — Public Works hands off to it rather than
# duplicating its cutl:/cwtr: tooling).
#
# Government is PUBLIC and every discipline is UNGATED, because these are
# ANALYSIS SEATS, NOT AUTHORITY SEATS: anyone may model the Mayor's budget, and
# the mode signs, files, certifies, and authorizes nothing. Role gating arrives
# only with real KYC-verified identity (see `studio_modes::UserRoles`), not with
# an env var — so nothing here is gated today rather than pretending to be.
#
# Government itself is NOT directly selectable in the Modes dropdown — it only
# expands to its submenu; a discipline must be chosen (see ribbon.slint's
# mode-row-touch handler). Disciplines render in the default grey, like every
# other mode's submenu.
#
# Two rules govern the tool sets below, and they are the whole point:
#   1. AGGREGATE ONLY. No tool profiles an individual, infers a protected
#      attribute, or reaches into a named official's private life. Institutional
#      and money-flow data from PUBLIC records only (docs/LAW-ORDER.md §3).
#   2. EVERY DISCIPLINE CARRIES A FALSIFIER — at least one tool able to produce
#      a result UNFAVOURABLE to its own operator's platform (a breakeven solver,
#      a net-vs-gross calculator, a regression guard). A civic model that cannot
#      contradict you is a prop.
#
# `tools = []` nowhere below: every id has a `tool_metadata` entry (generated),
# but almost none has live dispatch yet. That is the same honest-placeholder
# posture as Justice/Legal/Civil — a declared button is a declared intention,
# and `docs/architecture/GOVERNMENT_MODE.md` §6 is the order they get wired in.
#
# Canonical design doc: docs/architecture/GOVERNMENT_MODE.md
# Companion Universe:  scripts/gen_tucson_universe.py (Temple hub + 16 sim Spaces)

[mode]
id = "government"
name = "Government"
icon = "capitol"
# Mode-selection-menu color — Roblox BrickColor 194 "Medium stone grey".
# Institutional stone, deliberately distinct from Justice's khaki (#E2DCBC).
color = "#A3A2A5"
version = "1.0"
author = "Eustress"

[ribbon]
# Record-and-model work, not geometry work: home for essentials, data for the
# substrate, mindspace for policy/stakeholder graphs, test for running
# scenarios. Government is the first mode that is ~95% records and ~5% geometry
# — the inverse of every mode shipped so far.
tabs = ["home", "data", "mindspace", "test"]

[layout]
preset = "Wide Panels"

[theme]
# Matches [mode].color so the selection ring reads the same institutional stone
# as the mode's dropdown identity.
accent = "#A3A2A5"

