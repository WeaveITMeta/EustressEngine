# ---- 2. Council (Ward) ---------------------------------------------------
# A ward seat is citywide legislating read through one ward's ledger, so the
# four tabs follow that arc: know the ward, work the agenda, allocate every
# citywide policy DOWN to the ward, then keep the record.
#
# Two scope lines are load-bearing here, and they are why several otherwise
# obvious tools are absent:
#   - Nothing casts, counts, or certifies a vote. The Roll Call section reads
#     PUBLISHED minutes into a queryable record and analyzes the pattern; the
#     Clerk records votes, this seat only models them.
#   - No canvassing, voter-file, or walk-list tooling. That is campaign work
#     and it stays out of Government mode entirely (GOVERNMENT_MODE.md §4.4).
# Casework arrives person-level by nature and is operational record only: it is
# never joined into a published model, every published cut is aggregate under
# minimum-cell-size suppression, and nothing here profiles, predicts, or infers
# attributes about an individual (LAW-ORDER.md §3, U6).

[[submode_tabs]]
submode = "council"
id = "ward"
name = "Ward"
color = "#4ade80"
  # Aggregate public sources only — Census/ACS tables, the adopted zoning map,
  # Assessor parcels, the City's registered-neighborhood list.
  [[submode_tabs.sections]]
  name = "Ward Base"
  tools = ["gcnl:ward_census_viewer", "gcnl:ward_zoning_overlay", "gcnl:neighborhood_association_registry", "gcnl:ward_parcel_explorer"]
  # What the city actually delivers inside this ward and what it spends here.
  # `ward_capital_share_calculator` is per-capita CIP dollars in-ward against
  # citywide, which is a number that can come out against the seat holding it.
  [[submode_tabs.sections]]
  name = "Service Delivery"
  tools = ["gcnl:service_request_heatmap", "gcnl:ward_response_time_chart", "gcnl:ward_maintenance_backlog", "gcnl:ward_capital_share_calculator"]
  [[submode_tabs.sections]]
  name = "Public Engagement"
  tools = ["gcnl:town_hall_planner", "gcnl:public_comment_log", "gcnl:meeting_notice_composer"]

[[submode_tabs]]
submode = "council"
id = "legislative"
name = "Legislative"
color = "#60a5fa"
  # Drafts, never enacts. `legal_authority_checker` tests a draft against the
  # charter and Arizona preemption statute and fails proposals the city has no
  # power to pass — the cheapest falsifier in the discipline.
  [[submode_tabs.sections]]
  name = "Drafting"
  tools = ["gcnl:ordinance_drafter", "gcnl:amendment_clause_tracker", "gcnl:fiscal_note_reviewer", "gcnl:legal_authority_checker"]
  # Whether an item can lawfully be heard, and when. `consent_calendar_splitter`
  # pulls an item off consent so it takes a recorded vote instead of passing in
  # a block.
  [[submode_tabs.sections]]
  name = "Agenda"
  tools = ["gcnl:agenda_reviewer", "gcnl:consent_calendar_splitter", "gcnl:notice_period_checker", "gcnl:agenda_deadline_tracker"]
  # Published minutes only. `vote_threshold_checker` reports the majority or
  # supermajority an item needs; it does not tally one.
  [[submode_tabs.sections]]
  name = "Roll Call"
  tools = ["gcnl:roll_call_archive", "gcnl:vote_history_chart", "gcnl:coalition_finder", "gcnl:vote_threshold_checker"]

[[submode_tabs]]
submode = "council"
id = "ward-impact"
name = "Ward Impact"
color = "#fb923c"
  # S14 lives here: take every citywide output and allocate it to this ward by
  # incidence. A ward member is elected by one ward and answers to it.
  [[submode_tabs.sections]]
  name = "Incidence"
  tools = ["gcnl:ward_impact_calculator", "gcnl:tax_burden_share_viewer", "gcnl:fee_incidence_model"]
  # Built to be able to return the unwelcome answer.
  # `income_regressivity_screener` ranks wards by burden against income and
  # reports when a proposal's cost lands hardest on the lowest-income wards.
  [[submode_tabs.sections]]
  name = "Winners & Losers"
  tools = ["gcnl:ward_service_spend_gap_calculator", "gcnl:ward_per_capita_spend_choropleth", "gcnl:income_regressivity_screener"]
  # `ward_cost_shift_calculator` nets a cut against the cost it pushes onto
  # residents (added travel, private substitution, downstream service use): a
  # cut that only moves cost is a transfer, not a saving.
  # `service_regression_guard` is S13 read at ward scale and exists to reject
  # cuts, not to approve them.
  [[submode_tabs.sections]]
  name = "Scenario Review"
  tools = ["gcnl:policy_scenario_comparator", "gcnl:ward_cost_shift_calculator", "gcnl:ward_service_impact_viewer"]

[[submode_tabs]]
submode = "council"
id = "casework"
name = "Casework & Record"
color = "#a78bfa"
  # Operational queue only — routing and deadlines, no profiling and no
  # prediction. `casework_redaction_editor` strips identifying detail before
  # anything leaves the office or reaches the Insight section.
  [[submode_tabs.sections]]
  name = "Casework"
  tools = ["gcnl:casework_category_intake_log", "gcnl:referral_tracker", "gcnl:response_deadline_monitor", "gcnl:casework_redaction_editor"]
  # Aggregate-only: counts by category and by area, never by person. A
  # recurring issue is evidence for an ordinance, which is the loop that makes
  # casework legislative rather than clerical.
  [[submode_tabs.sections]]
  name = "Insight"
  tools = ["gcnl:recurring_issue_finder", "gcnl:issue_category_breakdown", "gcnl:issue_triage_router", "gcnl:service_gap_analyzer"]
  # The seat's own record, published. Attendance and disclosure point at the
  # officeholder, not at constituents.
  [[submode_tabs.sections]]
  name = "Record & Publication"
  tools = ["gcnl:attendance_log", "gcnl:disclosure_registry", "gcnl:vote_explainer", "gcnl:ward_report_composer"]

[[submode_tabs]]
submode = "budget"
id = "jurisdiction"
name = "Jurisdiction"
color = "#A3A2A5"
  [[submode_tabs.sections]]
  name = "Boundaries"
  tools = ["gov:jurisdiction_loader", "gov:ward_boundary_importer", "gov:parcel_importer"]
  [[submode_tabs.sections]]
  name = "Sources"
  tools = ["data:import", "gov:open_data_connector", "gov:provenance_inspector"]
  [[submode_tabs.sections]]
  name = "Scenarios"
  tools = ["gov:scenario_manager", "gov:run_comparator", "gov:publish_dashboard"]

