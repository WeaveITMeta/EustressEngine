# Every tab here is an ANALYSIS seat: it drafts, costs, and scores — it does
# not adopt, sign, appoint, or transmit. `exec-authority` exists because the
# largest single risk to this seat's agenda is asserting powers that the
# charter, the council-manager structure, and Arizona preemption do not grant
# it; `authority_boundary_checker` and `preemption_conflict_screener` are
# there to say so before a debate does.

