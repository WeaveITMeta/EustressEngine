# ---- 12. Constituent Services (311) -------------------------------------
# The 311 seat: request intake, auto-triage, service-level monitoring,
# recurring-issue detection, and resolution verification. 311 records arrive
# person-level by nature, so the Privacy Gate section is load-bearing rather
# than decorative (GOVERNMENT_MODE.md U6 / §7.4 + LAW-ORDER.md §3): the
# aggregation class is checked, direct identifiers are reviewed out, and every
# published aggregate passes minimum-count suppression BEFORE it can be joined
# into a model. Recurrence is detected against LOCATIONS and CITY ASSETS, never
# against requesters — there is no caller profile anywhere in this discipline.
# This is an analysis seat: a status update is COMPOSED and a work order is
# TRACKED; nothing here issues, dispatches, certifies, or transmits an official
# act.

