# ANALYSIS SEAT, NOT AN AUTHORITY SEAT. Nothing here signs, certifies,
# files, or releases an official record — a tool may STAGE a release
# package and compute its hash; the release itself is an act of the office,
# performed outside this engine. There is deliberately no vote-casting,
# no ballot tabulation, and no signature verification anywhere in this
# discipline: the Elections tab models election ADMINISTRATION (siting,
# queues, staffing, cost, ballot language) and reads only already-published
# aggregate results. See docs/architecture/GOVERNMENT_MODE.md §8.1 — the
# defensible version of "unfudgeable records" is Merkle anchoring through
# the bliss witness ledger, not blockchain voting.
#
# PRIVACY (LAW-ORDER.md §3, binding): the unit of analysis is the FILER,
# the COMMITTEE, the RECORD SERIES, or the PRECINCT — never a person. No
# voter file, no donor-level mapping, no requester profiling. The Privacy
