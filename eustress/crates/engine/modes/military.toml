# Eustress Mode — "Military".
# Terrain-centric operations planning + logistics. Six service-branch submodes.

[mode]
id = "military"
name = "Military"
icon = "military"
# Mode-selection-menu color - Roblox BrickColor Silver flip/flop (179) - closest dark grey silver.
color = "#898788"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "model", "terrain", "data", "test"]

[layout]
preset = "Wide Panels"

[theme]
# Matches [mode].color so the selection ring/active-tool tint reads the same
# silver-grey as the mode's own dropdown/header identity color.
accent = "#898788"

# Branches render in the default grey (like every other mode's submenu, e.g.
# Business's) — no per-branch color override.
[[submodes]]
id = "marines"
name = "Marines"
icon = "crosshair"

[[submodes]]
id = "army"
name = "Army"
icon = "shield"

[[submodes]]
id = "navy"
name = "Navy"
icon = "anchor"

[[submodes]]
id = "coast-guard"
name = "Coast Guard"
icon = "lifebuoy"

[[submodes]]
id = "air-force"
name = "Air Force"
icon = "plane"

[[submodes]]
id = "space-force"
name = "Space Force"
icon = "satellite"

[[tabs]]
id = "operations"
name = "Operations"
color = "#4ade80"

  [[tabs.sections]]
  name = "Planning"
  tools = ["mil:mission_planner", "mil:op_overlay", "mil:warno_builder"]

  # `data:overlay` had no Rust-side handler (a pre-existing dead button
  # shared with the built-in Data tab, see ribbon.slint) — dropped, matching
  # civil.toml's identical fix.
  [[tabs.sections]]
  name = "Map"
  tools = ["data:grid"]

[[tabs]]
id = "logistics"
name = "Logistics"
color = "#ffd166"

  [[tabs.sections]]
  name = "Supply"
  tools = ["data:import", "data:stats", "data:record"]

# ── Per-branch submode_tabs — Operations and Logistics are universal (every
# branch plans and supplies), so both carry forward verbatim into every
# branch's block, plus one new branch-specific tab. No per-branch colors
# (reverted earlier, stays that way — branches render in the default grey
# like every other mode's submenu). `tools = []` throughout. ───────────────

