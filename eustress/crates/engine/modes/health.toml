# Eustress Mode — "Health".
# Clinical / wellness data work: patient records and live vitals monitoring.

[mode]
id = "health"
name = "Health"
icon = "health"
# Mode-selection-menu color - Roblox BrickColor Pink (1016) - closest bright pink.
color = "#FF66CC"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "data", "test"]

[layout]
preset = "Wide Panels"

[theme]
# Matches [mode].color so the selection ring/active-tool tint reads Pink too,
# not just the dropdown/header identity color.
accent = "#FF66CC"

# Health itself is NOT directly selectable in the Modes dropdown (see
# ribbon.slint's mode-row-touch handler: any mode with submodes only expands
# its submenu) — a discipline must be chosen.
[[submodes]]
id = "clinical"
name = "Clinical"
icon = "heart-pulse"

[[submodes]]
id = "public-health"
name = "Public Health"
icon = "globe"

[[submodes]]
id = "biomedical"
name = "Biomedical"
icon = "microscope"

[[submodes]]
id = "nursing"
name = "Nursing"
icon = "checklist"

[[submodes]]
id = "pharmacy"
name = "Pharmacy"
icon = "pill"

[[submodes]]
id = "allied-health"
name = "Allied Health"
icon = "users"

[[tabs]]
id = "patients"
name = "Patients"
color = "#3ce0b0"

  [[tabs.sections]]
  name = "Records"
  tools = ["hlth:patient_chart", "hlth:medical_history", "hlth:problem_list"]

  [[tabs.sections]]
  name = "Intake"
  tools = ["data:import"]

[[tabs]]
id = "vitals"
name = "Vitals"
color = "#ff5470"

  [[tabs.sections]]
  name = "Monitoring"
  tools = ["data:chart", "data:timeline", "data:record"]

# ── Per-discipline submode_tabs — Patients and Vitals are universal (every
# discipline touches patient records/vitals data in some form), so both
# carry forward verbatim into every discipline's block, plus one new
# discipline-specific tab. `tools = []` throughout except where a section's
# purpose genuinely matches an already-wired action. ───────────────────────

