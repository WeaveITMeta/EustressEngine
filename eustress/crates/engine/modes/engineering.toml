# Eustress Mode — "Engineering" (the default).
#
# A Mode reconfigures the Studio for a kind of work: which ribbon tabs show,
# the default panel Layout, and an optional accent color. This is pure data —
# copy it to %LOCALAPPDATA%/Eustress/Modes/<yourmode>.toml, change [mode].id,
# and it appears in the top-left Eustress Modes dropdown.

[mode]
id = "engineering"
name = "Engineering"
icon = "gear"          # allowed: gear, gavel
version = "1.0"
author = "Eustress"

[ribbon]
# The full toolset. Order is preserved. Valid ids: home, model, cad, data,
# ui, terrain, test, mindspace, plugins.
tabs = ["home", "model", "cad", "data", "ui", "terrain", "test", "mindspace", "plugins"]

[layout]
preset = "Default"     # Default | Scripting | Building | Minimal | Wide Panels

# [theme] omitted — Engineering uses the active theme's own accent.

# Engineering itself is NOT directly selectable in the Modes dropdown (see
# ribbon.slint's mode-row-touch handler: any mode with submodes only expands
# its submenu) — a discipline must be chosen. No "Civil" here deliberately —
# Civil Engineering already lives at the standalone top-level "civil" MODE
# (bridges/terrain), which carries its own discipline submenu instead.
[[submodes]]
id = "mechanical"
name = "Mechanical"
icon = "gear"

[[submodes]]
id = "electrical"
name = "Electrical"
icon = "lightning"

[[submodes]]
id = "chemical"
name = "Chemical"
icon = "flask"

[[submodes]]
id = "aerospace"
name = "Aerospace"
icon = "plane"

[[submodes]]
id = "materials"
name = "Materials"
icon = "layers"

[[submodes]]
id = "systems"
name = "Systems"
icon = "network"

[[submodes]]
id = "industrial"
name = "Industrial"
icon = "factory"

# ── Per-discipline submode_tabs — Engineering has no mode-level custom tabs
# to carry forward (it already shows the full 9-tab built-in ribbon, unlike
# Civil's trimmed subset), so each discipline just gets one new tab.
# `tools = []` throughout — matches Civil's own choice not to duplicate
# generic CAD primitives (already reachable via the built-in "cad" tab) into
# a discipline tab. ─────────────────────────────────────────────────────────

