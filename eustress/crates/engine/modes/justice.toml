# Eustress Mode — "Justice".
#
# A focused layout for policy / governance / case work: a trimmed ribbon,
# MindSpace for case-relationship graphs, and a scripting-forward panel
# layout, with a distinctive amber accent so the whole Studio signals "you
# are in Justice mode". Docket/Evidence tabs are forward-looking (declared
# ahead of their tooling).
#
# Justice is PUBLIC — open to everyone. Only the "Judge" submode is gated,
# to holders of the "judge" role (see `studio_modes::UserRoles` — v1 is
# client-side/env-var, with KYC-verified-identity → Cloudflare KV role
# assignment as the documented production path). Submodes: Civil, Criminal,
# Judge (gated). Civil and Criminal are meant to branch further later.
#
# Justice itself is NOT directly selectable in the Modes dropdown — it only
# expands to its submenu; a submode must be chosen (see ribbon.slint's
# mode-row-touch handler). Civil and Criminal each carry their OWN Case tab
# (via [[submode_tabs]] below — see `ModeManifest::effective_custom_tabs`);
# the top-level [[tabs]] below (Docket + Evidence, no Case) is what Judge and
# any not-yet-resolved submode fall back to — judges preside over dockets and
# evidence, they don't build cases themselves.
#
# NOTE: this "civil" submode is CIVIL LAW (private disputes) — unrelated to
# the separate top-level "civil" MODE (civil ENGINEERING: bridges/terrain).

[mode]
id = "justice"
name = "Justice"
icon = "gavel"
# Mode-selection-menu color - Roblox BrickColor Khaki (347).
color = "#E2DCBC"
version = "1.0"
author = "Eustress"

[ribbon]
# A deliberately small subset — home for essentials, data for records/evidence,
# mindspace for case graphs, test for running scenarios.
tabs = ["home", "data", "mindspace", "test"]

[layout]
preset = "Scripting"

[theme]
# Matches [mode].color so the selection ring/active-tool tint reads the same
# khaki as the mode's own dropdown/header identity color.
accent = "#E2DCBC"

# Submodes render in the default grey (like every other mode's submenu, e.g.
# Business's) — no per-submode color override.
[[submodes]]
id = "civil"
name = "Civil"
icon = "scales"

[[submodes]]
id = "criminal"
name = "Criminal"
icon = "shield"

[[submodes]]
id = "judge"
name = "Judge"
icon = "gavel"
# Gated: this submode is hidden from Justice's submenu unless the user holds
# the "judge" role. Justice itself stays open to all.
required-role = "judge"

# ── Fallback tabs (Judge + unresolved submode) — Docket & Evidence only; see
# the file header for why Case lives per-submode instead. ──────────────────

[[tabs]]
id = "docket"
name = "Docket"
color = "#e8912d"

  [[tabs.sections]]
  name = "Calendar"
  tools = ["jus:court_calendar", "jus:smart_schedule", "jus:conflict_detector"]

  [[tabs.sections]]
  name = "Filings"
  tools = ["jus:efiling_queue", "jus:service_of_process", "jus:proof_of_service"]

  [[tabs.sections]]
  name = "Deadlines"
  tools = ["jus:sol_clock", "jus:speedy_trial_calc", "jus:brady_alerts"]

[[tabs]]
id = "evidence"
name = "Evidence"
color = "#ff5470"

  [[tabs.sections]]
  name = "Exhibits"
  tools = ["data:import", "data:record"]

  [[tabs.sections]]
  name = "Chain of Custody"
  tools = ["jus:custody_log", "jus:hash_verifier", "jus:redaction_tool"]

  [[tabs.sections]]
  name = "Analysis"
  tools = ["data:chart", "data:stats"]

# ── Tech — Integrity Ledger + Open Algorithms (the two user-endorsed
# engine-native directions; see the 2026-07-21 Integrity-Ledger spec in the
# session notes). AI Legal Hotline and Sentinel remain deliberately ABSENT
# — explicit product decision (2026-07-21): they are full external
# crisis-response/ML products (phone infrastructure, paid voice-AI vendors,
# hired legal analysts — see E:\Justice\Centralized\Modules\AILegalHotline\
# AI-Hotline.md and E:\Justice\docs\Sentinel.md), and a button that looks
# like a working hotline to someone who clicks it expecting real help is a
# harm, not a placeholder. Do not add them as dream buttons. ────────────────

[[tabs]]
id = "tech"
name = "Tech"
color = "#4fd6ff"

  [[tabs.sections]]
  name = "Integrity Ledger"
  tools = ["jus:ledger_viewer", "jus:integrity_verify", "jus:proof_export"]

  [[tabs.sections]]
  name = "Open Algorithms"
  tools = ["jus:algorithm_registry", "jus:audit_log", "jus:bias_stress_test"]

# ── Metrics / Reform / Reference — added 2026-07-21 per the user's Justice
# System Framework ribbon pitch, scoped down via a Fable-5 design consult:
# the pitch's Compare tab folded into Metrics' "Comparative" section, and
# Stakeholders + Resources merged into one "Reference" tab (10 proposed
# top-level tabs would have made the strip unworkably wide). These three
# apply regardless of which submode is active (a judge, a prosecutor, and a
# civil attorney all want dashboards/reform-testing/directory access) — so,
# like Docket and Tech above, they're declared BOTH here (Judge/no-submode
# fallback) AND duplicated into each of Criminal's and Civil's submode_tabs
# below, since a submode's set REPLACES the fallback rather than merging
# with it. `tools = []` throughout except where a section's purpose
# genuinely matches an already-wired `data:*` action (chart/stats/grid/
# import) — no synthetic "looks-clickable-but-isn't" button ids, for the
# same reason Tech's AI-Hotline/Sentinel buttons stay empty above: a button
# that appears to work but doesn't is a worse failure mode for a judge or
# advocate than an honest "Coming soon" placeholder. ──────────────────────

[[tabs]]
id = "metrics"
name = "Metrics"
color = "#34d399"

  [[tabs.sections]]
  name = "Universal Dashboards"
  tools = ["data:chart", "data:stats", "data:grid"]

  [[tabs.sections]]
  name = "Real-Time"
  tools = ["jus:live_monitor", "jus:alert_builder", "jus:disparity_heatmap"]

  [[tabs.sections]]
  name = "Audit"
  tools = ["jus:bias_detector", "jus:transparency_report", "jus:open_data_export"]

