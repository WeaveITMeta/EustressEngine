# Eustress Mode — "Student".
# Learning-first workspace: modeling + data for coursework, MindSpace for
# note-graphs, and forward-looking Notebook/Assignments tabs.

[mode]
id = "student"
name = "Student"
icon = "mortarboard"
# Mode-selection-menu color — Roblox BrickColor Bright blue (23).
color = "#0D69AC"
version = "1.0"
author = "Eustress"

[ribbon]
tabs = ["home", "model", "data", "mindspace", "test"]

[layout]
preset = "Default"

[theme]
# Matches [mode].color so the selection ring/active-tool tint reads the same
# deep blue as the mode's own dropdown/header identity color.
accent = "#0D69AC"

# Student itself is NOT directly selectable in the Modes dropdown (see
# ribbon.slint's mode-row-touch handler: any mode with submodes only expands
# its submenu) — a subject must be chosen.
[[submodes]]
id = "mathematics"
name = "Mathematics"
icon = "sigma"

[[submodes]]
id = "physics"
name = "Physics"
icon = "atom"

[[submodes]]
id = "chemistry"
name = "Chemistry"
icon = "flask"

[[submodes]]
id = "biology"
name = "Biology"
icon = "dna"

[[submodes]]
id = "computer-science"
name = "Computer Science"
icon = "terminal"

[[submodes]]
id = "history"
name = "History"
icon = "book"

[[submodes]]
id = "classical-languages-literature"
name = "Classical Languages & Literature"
icon = "pen"

[[submodes]]
id = "philosophy"
name = "Philosophy"
icon = "brain"

[[submodes]]
id = "economics"
name = "Economics"
icon = "trend-up"

[[tabs]]
id = "notebook"
name = "Notebook"
color = "#4fd6ff"

  [[tabs.sections]]
  name = "Study"
  tools = ["data:timeline", "data:chart"]

  [[tabs.sections]]
  name = "Notes"
  tools = ["stu:cornell_notes", "stu:flashcard_deck", "stu:concept_map"]

[[tabs]]
id = "assignments"
name = "Assignments"
color = "#ffd166"

  [[tabs.sections]]
  name = "Work"
  tools = ["stu:assignment_tracker", "stu:due_date_board", "stu:submission_checklist"]

