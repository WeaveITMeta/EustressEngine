# ── Computer Science "dream scenario" (2026-07-21, per explicit direction):
# three tabs spanning Fundamentals -> Programming -> Theory & Mastery,
# instead of one thin tab, so the discipline actually specializes the
# layout. Buttons below use invented `cs:*` ids that have NO Rust dispatch
# yet — explicitly OK per direction ("you do not yet have to make the UI
# buttons functional... just dream"); they render as real labeled buttons
# (not "Coming soon" placeholders) but are silently inert when clicked,
# same as any unrecognized action id elsewhere in this codebase. The one
# exception is "Projects", which keeps the genuinely-real `insert:script`
# family. NOTE: true toggle/slider widgets aren't buildable via this
# tools=[...] mechanism at all today (every entry renders as an IconButton,
# see ribbon.slint) — that's a separate, larger Slint-component engineering
# task, not something a tool-id list can express; flagged for the user
# rather than silently faked. ────────────────────────────────────────────

