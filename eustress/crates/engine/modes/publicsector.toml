# ---- 5. Compliance --------------------------------------------------------
# Registration and representation: the paperwork that decides whether a bid is
# even accepted. Also the home of the audit trail, because "prove how you
# decided" is a compliance question before it is anything else.

[[submode_tabs]]
submode = "compliance"
id = "cmp-registration"
name = "Registration"
color = "#0E7C6B"
  [[submode_tabs.sections]]
  name = "Entity"
  tools = ["pcmp:entity_registration_status", "pcmp:uei_record", "pcmp:cage_code_record"]
  [[submode_tabs.sections]]
  name = "Renewal"
  tools = ["pcmp:registration_expiry_monitor", "pcmp:renewal_checklist", "pcmp:poc_register"]
  [[submode_tabs.sections]]
  name = "Banking"
  tools = ["pcmp:remittance_record", "pcmp:tax_identification_record", "pcmp:eft_status"]

[[submode_tabs]]
submode = "compliance"
id = "cmp-reps"
name = "Representations"
color = "#fbbf24"
  [[submode_tabs.sections]]
  name = "Reps and Certs"
  tools = ["pcmp:reps_and_certs_review", "pcmp:annual_representation_diff", "pcmp:certification_expiry_monitor"]
  [[submode_tabs.sections]]
  name = "Socioeconomic"
  tools = ["pcmp:socioeconomic_status_record", "pcmp:certification_evidence_index", "pcmp:joint_venture_record"]
  [[submode_tabs.sections]]
  name = "Exclusions"
  tools = ["pcmp:exclusion_self_check", "pcmp:responsibility_matters_log", "pcmp:disclosure_log"]

[[submode_tabs]]
submode = "compliance"
id = "cmp-flowdowns"
name = "Flowdowns"
color = "#f87171"
  [[submode_tabs.sections]]
  name = "Clauses"
  tools = ["pcmp:far_clause_extractor", "pcmp:flowdown_matrix", "pcmp:subcontract_clause_pack"]
  [[submode_tabs.sections]]
  name = "Programs"
  tools = ["pcmp:cybersecurity_requirement_check", "pcmp:labour_standards_check", "pcmp:accessibility_requirement_check"]
  [[submode_tabs.sections]]
  name = "Obligations"
  tools = ["pcmp:recurring_obligation_calendar", "pcmp:reporting_obligation_log", "pcmp:training_obligation_log"]

[[submode_tabs]]
submode = "compliance"
id = "cmp-size"
name = "Size and Status"
color = "#38bdf8"
  [[submode_tabs.sections]]
  name = "Size Standards"
  tools = ["pcmp:size_standard_lookup", "pcmp:receipts_average_calculator", "pcmp:employee_count_calculator"]
  [[submode_tabs.sections]]
  name = "Affiliation"
  tools = ["pcmp:affiliation_worksheet", "pcmp:ownership_record", "pcmp:control_test_notes"]
  # Falsifier: outgrowing a size standard removes the set-asides a firm's
  # whole pipeline depends on, and it is better learned early than at protest.
  [[submode_tabs.sections]]
  name = "Trajectory"
  tools = ["pcmp:size_threshold_forecaster", "pcmp:set_aside_exposure_report", "pcmp:graduation_planner"]

[[submode_tabs]]
submode = "compliance"
id = "cmp-audit"
name = "Audit Trail"
color = "#a78bfa"
  # Every capture decision is one folder on disk holding the raw payload, the
  # screen, the score with its derivation, the matrix, and a Merkle manifest.
  # An auditor with `cat` and nothing else can reconstruct any decision.
  [[submode_tabs.sections]]
  name = "Records"
  tools = ["pcmp:capture_record_index", "pcmp:open_capture_folder", "pcmp:record_summary"]
  [[submode_tabs.sections]]
  name = "Integrity"
  tools = ["pcmp:verify_audit_trail", "pcmp:manifest_viewer", "pcmp:tamper_report"]
  [[submode_tabs.sections]]
  name = "Export"
  tools = ["pcmp:export_decision_log", "pcmp:export_audit_bundle", "pcmp:retention_policy_notes"]
