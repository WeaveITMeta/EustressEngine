  [[submode_tabs.sections]]
  name = "Colour Teams"
  tools = ["pprp:pink_team_checklist", "pprp:red_team_checklist", "pprp:gold_team_checklist"]
  [[submode_tabs.sections]]
  name = "Responsiveness"
  tools = ["pprp:responsiveness_check", "pprp:format_compliance_check", "pprp:submission_checklist"]
  [[submode_tabs.sections]]
  name = "Package"
  tools = ["pprp:assemble_package", "pprp:package_manifest", "pprp:final_read_log"]

# ---- 3. Grants ------------------------------------------------------------
# A grant is not a contract. 2 CFR 200 governs instead of the FAR, the
# narrative sections differ, the budget carries an indirect rate, and
# eligibility turns on organization type rather than a set-aside code. Folding
# this into Proposal would produce a template that fits neither.

[[submode_tabs]]
submode = "grants"
id = "grt-announcements"
name = "Announcements"
color = "#0E7C6B"
  [[submode_tabs.sections]]
  name = "Feed"
  tools = ["pgrt:browse_announcements", "pgrt:fetch_full_announcement", "pgrt:forecast_watch"]
  [[submode_tabs.sections]]
  name = "Filters"
  tools = ["pgrt:aln_filter", "pgrt:funding_category_filter", "pgrt:applicant_type_filter"]
  [[submode_tabs.sections]]
  name = "Deadlines"
  tools = ["pgrt:close_date_monitor", "pgrt:letter_of_intent_tracker", "pgrt:cycle_calendar"]

[[submode_tabs]]
submode = "grants"
id = "grt-eligibility"
name = "Eligibility"
color = "#fbbf24"
  [[submode_tabs.sections]]
  name = "Applicant"
  tools = ["pgrt:organization_profile", "pgrt:applicant_type_checker", "pgrt:sam_registration_status"]
  [[submode_tabs.sections]]
  name = "Program"
  tools = ["pgrt:eligibility_parser", "pgrt:cost_share_calculator", "pgrt:service_area_checker"]
  [[submode_tabs.sections]]
  name = "Screening"
  tools = ["pgrt:screen_announcements", "pgrt:ineligibility_report", "pgrt:priority_area_matcher"]

[[submode_tabs]]
submode = "grants"
id = "grt-narrative"
name = "Narrative"
color = "#38bdf8"
  [[submode_tabs.sections]]
  name = "Sections"
  tools = ["pgrt:narrative_outline", "pgrt:project_abstract", "pgrt:statement_of_need"]
  [[submode_tabs.sections]]
  name = "Design"
  tools = ["pgrt:logic_model_builder", "pgrt:goals_and_objectives", "pgrt:workplan_timeline"]
  [[submode_tabs.sections]]
  name = "Evidence"
  tools = ["pgrt:need_data_sourcer", "pgrt:evaluation_plan", "pgrt:outcome_measure_picker"]

[[submode_tabs]]
submode = "grants"
id = "grt-budget"
name = "Budget"
color = "#4ade80"
  [[submode_tabs.sections]]
  name = "Build"
  tools = ["pgrt:budget_builder", "pgrt:personnel_calculator", "pgrt:fringe_calculator"]
  [[submode_tabs.sections]]
  name = "Indirect"
  tools = ["pgrt:indirect_rate_applier", "pgrt:de_minimis_checker", "pgrt:modified_total_direct_cost"]
  # A budget narrative that does not tie to the workplan is the most common
  # reason a technically sound application is scored down.
