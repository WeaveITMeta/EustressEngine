# ---- 4. Contracts ---------------------------------------------------------
# After the award. The seat that decides whether a won contract is profitable,
# and the one small firms most often have no tooling for at all. The
# cost-growth analyzer is the falsifier: it can tell an operator the work they
# fought for is losing money.

[[submode_tabs]]
submode = "contracts"
id = "con-award"
name = "Award"
color = "#0E7C6B"
  [[submode_tabs.sections]]
  name = "Record"
  tools = ["pcon:award_register", "pcon:contract_type_notes", "pcon:period_of_performance"]
  [[submode_tabs.sections]]
  name = "Structure"
  tools = ["pcon:clin_builder", "pcon:option_year_tracker", "pcon:ceiling_tracker"]
  [[submode_tabs.sections]]
  name = "Kickoff"
  tools = ["pcon:kickoff_checklist", "pcon:deliverable_schedule", "pcon:key_personnel_letters"]

[[submode_tabs]]
submode = "contracts"
id = "con-performance"
