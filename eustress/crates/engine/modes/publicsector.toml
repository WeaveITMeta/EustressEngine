  [[submode_tabs.sections]]
  name = "Matrix"
  tools = ["pprp:compliance_matrix", "pprp:export_matrix_csv", "pprp:matrix_coverage_chart"]
  # The falsifier: what the firm cannot answer today.
  [[submode_tabs.sections]]
  name = "Gaps"
  tools = ["pprp:gap_report", "pprp:gap_assignment", "pprp:gap_to_no_bid_escalation"]
  [[submode_tabs.sections]]
  name = "Traceability"
  tools = ["pprp:citation_checker", "pprp:uncited_claim_finder", "pprp:cross_reference_map"]

[[submode_tabs]]
