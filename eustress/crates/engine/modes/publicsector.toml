# Eustress Mode — "Public Sector".
#
# The SELL side of federal contracting and grants: a small contractor, grant
# writer, or nonprofit answering a solicitation. Its counterpart is the
# `government` mode's `procurement` discipline, which models the BUYER issuing
# one. Same domain, opposite seats, and they are deliberately separate modes:
# Government is a public analysis seat that signs and files nothing, while this
# is a commercial seat that exists to win the work. Folding a vendor capture
# desk into Government would compromise that charter and would read as an
# attack line the first time anyone noticed.
#
# Three rules govern every tool set below.
#
#   1. THE ENGINE DRAFTS; A HUMAN FILES. Nothing here submits a bid, signs a
#      certification, or transmits to SAM.gov or Grants.gov. Both APIs are
#      read-only on this path and there is no write path to add by accident.
#
#   2. EVERY DISCIPLINE CARRIES A FALSIFIER — at least one tool able to return
#      a result unfavourable to its own operator. Capture has the no-bid
#      recommender and the calibration harness; Proposal has the compliance-gap
#      report; Contracts has the cost-growth analyzer. A capture tool that only
#      ever encourages the bid is a lead generator for whoever sold it.
#
#   3. OWN DATA IS FAIR GAME; OTHER PARTIES ARE AGGREGATE ONLY. The firm's own
#      UEI, personnel, and past performance are inputs. Competitors appear
#      through public award records only, never as profiled individuals.
#
# Unlike every mode shipped before it, a meaningful share of these buttons are
# LIVE rather than declared intentions: the ingest, screening, scoring,
# compliance-matrix, draft, deal-room, and audit paths all run
# (`crates/engine/src/capture/`). The rest follow the same honest-placeholder
# posture as the other modes — a declared button is a declared intention, and
# clicking one says so and counts the click as a vote.
#
# Canonical design doc: docs/architecture/GOV_CAPTURE_PIPELINE.md

[mode]
id = "publicsector"
name = "Public Sector"
icon = "handshake"
# Deep teal — distinct from Government's institutional stone (#A3A2A5),
# Business's red (#C4281C), and the editor's selection cyan (#00bcd4).
color = "#0E7C6B"
version = "1.0"
author = "Eustress"

[ribbon]
# Record work with a spatial payoff: `data` for the Connector and Dataset
# substrate, `mindspace` for the 3D deal room, `test` for win-rate calibration
# runs. No geometry tabs — nothing here models a shape.
tabs = ["home", "data", "mindspace", "test"]

[layout]
preset = "Wide Panels"

[theme]
accent = "#0E7C6B"

# Public Sector is NOT directly selectable in the Modes dropdown — it expands to
# its submenu and a discipline must be chosen (see ribbon.slint's
# mode-row-touch handler). Disciplines render in the default grey.
[[submodes]]
id = "capture"
name = "Capture"
icon = "binoculars"

[[submodes]]
id = "proposal"
name = "Proposal"
icon = "scroll"

[[submodes]]
id = "grants"
name = "Grants"
icon = "certificate"

[[submodes]]
id = "contracts"
name = "Contracts"
icon = "stamp"

[[submodes]]
id = "compliance"
name = "Compliance"
icon = "shield"

# ---- 1. Capture -----------------------------------------------------------
# The business-development seat: ingest the public feeds, screen against the
# firm's own registrations, rank what survives, and stand inside the result.
# The falsifiers live here — a no-bid recommender and a calibration harness
# that scores the ranking against outcomes that already happened.

[[submode_tabs]]
submode = "capture"
id = "cap-sources"
name = "Sources"
color = "#0E7C6B"
  [[submode_tabs.sections]]
  name = "Feeds"
  tools = ["pcap:add_sam_source", "pcap:add_grants_source", "pcap:sync_now", "pcap:source_status"]
  [[submode_tabs.sections]]
  name = "Filters"
  tools = ["pcap:naics_filter_editor", "pcap:set_aside_filter", "pcap:agency_filter", "pcap:keyword_filter"]
  [[submode_tabs.sections]]
  name = "Credentials"
  tools = ["pcap:api_key_status", "pcap:quota_monitor", "pcap:fetch_log"]

[[submode_tabs]]
submode = "capture"
id = "cap-screening"
name = "Screening"
color = "#fbbf24"
  [[submode_tabs.sections]]
  name = "Firm Profile"
  tools = ["pcap:capability_statement", "pcap:naics_registrations", "pcap:certification_ledger", "pcap:capacity_limits"]
  [[submode_tabs.sections]]
  name = "Gates"
  tools = ["pcap:screen_pipeline", "pcap:eligibility_checker", "pcap:deadline_monitor", "pcap:capacity_screener"]
  # The report that tells a firm which single registration or certification
  # would unlock the most pipeline — more useful than the pass list alone.
  [[submode_tabs.sections]]
  name = "Rejection Analysis"
  tools = ["pcap:rejection_report", "pcap:unlock_opportunity_analyzer", "pcap:unknown_field_report"]

[[submode_tabs]]
submode = "capture"
id = "cap-fit"
name = "Fit"
color = "#38bdf8"
  [[submode_tabs.sections]]
  name = "Scoring"
  tools = ["pcap:score_pipeline", "pcap:criterion_weights", "pcap:score_explainer", "pcap:rank_viewer"]
  # Falsifiers. Both can return an answer the operator does not want.
  [[submode_tabs.sections]]
  name = "Bid Decision"
  tools = ["pcap:no_bid_report", "pcap:bid_cost_estimator", "pcap:win_probability_notes"]
  [[submode_tabs.sections]]
  name = "Calibration"
  tools = ["pcap:calibrate_model", "pcap:outcome_recorder", "pcap:precision_recall_chart"]

[[submode_tabs]]
submode = "capture"
id = "cap-pipeline"
name = "Pipeline"
color = "#a78bfa"
  [[submode_tabs.sections]]
  name = "Stages"
  tools = ["pcap:stage_board", "pcap:advance_stage", "pcap:stale_notice_sweep", "pcap:amendment_watch"]
  [[submode_tabs.sections]]
  name = "Teaming"
  tools = ["pcap:partner_gap_matcher", "pcap:teaming_agreement_tracker", "pcap:subcontract_plan_notes"]
  [[submode_tabs.sections]]
  name = "Records"
  tools = ["pcap:capture_record_index", "pcap:open_capture_folder", "pcap:export_pipeline_csv"]

[[submode_tabs]]
submode = "capture"
id = "cap-dealroom"
name = "Deal Room"
color = "#4ade80"
  # The ranked pipeline as a space you walk: X is days to deadline, Y is fit
  # score, and the bid/watch/no-bid call is a lane you stand in.
  [[submode_tabs.sections]]
  name = "Build"
  tools = ["pcap:build_deal_room", "pcap:refresh_deal_room", "pcap:clear_deal_room"]
  [[submode_tabs.sections]]
  name = "Layout"
  tools = ["pcap:lane_layout", "pcap:axis_encoding", "pcap:node_scale_rules"]
  [[submode_tabs.sections]]
  name = "Walkthrough"
  tools = ["pcap:tour_closing_soon", "pcap:focus_top_ranked", "pcap:deal_room_legend"]

# ---- 2. Proposal ----------------------------------------------------------
