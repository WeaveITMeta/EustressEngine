id = "prp-requirements"
name = "Requirements"
color = "#0E7C6B"
  [[submode_tabs.sections]]
  name = "Extract"
  tools = ["pprp:extract_requirements", "pprp:import_attachment", "pprp:attachment_status", "pprp:requirement_browser"]
  [[submode_tabs.sections]]
  name = "Classify"
  tools = ["pprp:modal_strength_filter", "pprp:actor_filter", "pprp:section_grouping"]
  [[submode_tabs.sections]]
  name = "Sections L and M"
  tools = ["pprp:instructions_parser", "pprp:evaluation_factor_parser", "pprp:page_limit_tracker"]

[[submode_tabs]]
