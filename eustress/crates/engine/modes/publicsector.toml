color = "#4ade80"
  [[submode_tabs.sections]]
  name = "Delivery"
  tools = ["pcon:deliverable_tracker", "pcon:milestone_monitor", "pcon:acceptance_log"]
  [[submode_tabs.sections]]
  name = "Service Levels"
  tools = ["pcon:sla_tracker", "pcon:quality_plan", "pcon:corrective_action_log"]
  [[submode_tabs.sections]]
  name = "Assessment"
  tools = ["pcon:cpars_preparation", "pcon:self_assessment_notes", "pcon:reference_builder"]

[[submode_tabs]]
submode = "contracts"
