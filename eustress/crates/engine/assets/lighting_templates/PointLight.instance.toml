# PointLight: omnidirectional light source.
# Same shape as common/assets/class_schema/PointLight (the template Insert
# uses), written with described values. `light_classes` reads either.
# Brightness is a display-referred dial; Range is the light's reach.

[metadata]
class_name = "PointLight"
archivable = true
unit = "m"

[transform]
position = [0.0, 2.0, 0.0]
rotation = [0.0, 0.0, 0.0, 1.0]
scale = [1.0, 1.0, 1.0]

[Light]
Brightness = { type = "float", value = 1.0, min = 0.0, max = 100.0, description = "Brightness dial: 1 is a normal lamp, the same on screen by day and by night" }
Color      = { type = "Color3", value = [1.0, 1.0, 1.0], description = "Light hue" }
Range      = { type = "float", value = 16.0, min = 0.1, max = 10000.0, description = "Reach in metres: the light fades to nothing here" }
Radius     = { type = "float", value = 0.0, min = 0.0, max = 100.0, description = "Emitting sphere radius in metres: widens highlights" }
Shadows    = { type = "bool",  value = false, description = "Cast dynamic shadows (six shadow views per frame)" }
Enabled    = { type = "bool",  value = true, description = "Emit light" }
