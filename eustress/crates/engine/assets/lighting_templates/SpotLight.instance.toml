# SpotLight: cone of light out of a face of its parent part (its own -Z
# when it has no part). Same shape as common/assets/class_schema/SpotLight
# (the template Insert uses), written with described values.

[metadata]
class_name = "SpotLight"
archivable = true
unit = "m"

[transform]
position = [0.0, 5.0, 0.0]
rotation = [0.0, 0.0, 0.0, 1.0]
scale = [1.0, 1.0, 1.0]

[Light]
Brightness = { type = "float", value = 1.0, min = 0.0, max = 100.0, description = "Brightness dial: 1 is a normal lamp, the same on screen by day and by night" }
Color      = { type = "Color3", value = [1.0, 1.0, 1.0], description = "Light hue" }
Range      = { type = "float", value = 16.0, min = 0.1, max = 10000.0, description = "Reach in metres: the light fades to nothing here" }
Angle      = { type = "float", value = 90.0, min = 1.0, max = 180.0, description = "Full apex angle of the cone in degrees" }
Face       = { type = "enum",  value = "Front", options = ["Top", "Bottom", "Front", "Back", "Left", "Right"], description = "Face of the parent part the cone shines out of" }
Shadows    = { type = "bool",  value = false, description = "Cast dynamic shadows" }
Enabled    = { type = "bool",  value = true, description = "Emit light" }
