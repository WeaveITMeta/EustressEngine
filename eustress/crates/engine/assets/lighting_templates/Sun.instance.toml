# Sun: the sun's light, colour, disc and shadows.
# Auto-created with each Space in Lighting/ folder.
# .instance.toml extension causes the file loader to spawn this as an ECS entity.
#
# Where the sun stands is Lighting's: ClockTime, GeographicLatitude and the
# day cycle live on the service. See common/assets/class_schema/Star for
# what each key means.

[metadata]
class_name = "Star"
archivable = true

[star]
enabled = true
intensity = 130000.0
color = [255, 250, 242]
angular_size = 0.53
cast_shadows = true
god_rays = 1.0
day_of_year = 172
