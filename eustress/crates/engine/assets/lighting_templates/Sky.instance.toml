# Sky: the stars, and an optional authored cubemap.
# Auto-created with each Space in Lighting/ folder.
# .instance.toml extension causes the file loader to spawn this as an ECS entity.
#
# All six skybox faces set replaces the atmosphere's sky with that cubemap.
# See common/assets/class_schema/Sky for what each key means.

[metadata]
class_name = "Sky"
archivable = true

[sky]
celestial_bodies_shown = true
star_count = 5000
skybox_front = ""
skybox_back = ""
skybox_left = ""
skybox_right = ""
skybox_top = ""
skybox_bottom = ""
