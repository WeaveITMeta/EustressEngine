# Moon: its light, disc, phase and orbit.
# Auto-created with each Space in Lighting/ folder.
# .instance.toml extension causes the file loader to spawn this as an ECS entity.
#
# See common/assets/class_schema/Moon for what each key means.

[metadata]
class_name = "Moon"
archivable = true

[moon]
enabled = true
intensity = 0.5
color = [242, 242, 255]
angular_size = 2.0
lunar_day = 14.76
cast_shadows = true
glow = 0.2
earthshine = 0.02
orbital_inclination = 5.145
ascending_node = 0.0
follows_calendar = true
placement = "OppositeSun"
