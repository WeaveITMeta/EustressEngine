# Atmosphere: atmospheric scattering, sky rendering and sky-sourced reflections.
# Auto-created with each Space in Lighting/ folder.
# .instance.toml extension causes the file loader to spawn this as an ECS entity.
#
# These properties drive Bevy's physically-based atmosphere. Scattering
# coefficients are in units of 1e-6 per metre, so Earth at sea level reads as
# [5.802, 13.558, 33.1] for Rayleigh and 4.44 for Mie. See
# common/assets/class_schema/Atmosphere for what each key means.

[metadata]
class_name = "Atmosphere"
archivable = true

[atmosphere]
enabled = true
density = 0.5
offset = 0.0
color = [198, 220, 255]
decay_color = [112, 129, 162]
glare = 0.0
haze = 0.0
rayleigh_coefficient = [5.802, 13.558, 33.1]
mie_coefficient = 4.44
mie_direction = 0.758
planet_radius = 6371000.0
atmosphere_height = 100000.0
rendering_mode = "LookupTexture"
sky_max_samples = 32
environment_map_enabled = true
environment_intensity = 1.0
atmosphere_environment_light = true
