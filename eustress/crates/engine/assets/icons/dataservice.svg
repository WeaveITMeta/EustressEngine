<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- DataService: a stack of tables with a trend riding over it. The old icon
       was an atomic "i", which reads as "information" rather than as data you
       can chart, and it was indistinguishable from ExperimentService because
       both pointed at this file. -->
  <!-- three stacked table plates, back to front -->
  <rect x="2.2" y="9.9" width="11.6" height="2.5" rx="0.6" fill="#13314F" stroke="#2C5C86" stroke-width="0.7"/>
  <rect x="2.2" y="7.1" width="11.6" height="2.5" rx="0.6" fill="#163A5E" stroke="#3B82F6" stroke-width="0.7"/>
  <rect x="2.2" y="4.3" width="11.6" height="2.5" rx="0.6" fill="#1A4670" stroke="#5CA8FF" stroke-width="0.7"/>
  <!-- column dividers on the top plate, so it reads as a table not a bar -->
  <g stroke="#5CA8FF" stroke-width="0.55" opacity="0.75">
    <line x1="6.1" y1="4.5" x2="6.1" y2="6.6"/>
    <line x1="9.9" y1="4.5" x2="9.9" y2="6.6"/>
  </g>
  <!-- the trend: what the tables are FOR -->
  <path d="M3.1 13.9l3.1-1.9 2.6 1.0 4.1-2.6" stroke="#35D07A" stroke-width="1.05"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="12.9" cy="10.4" r="0.95" fill="#35D07A"/>
</svg>
