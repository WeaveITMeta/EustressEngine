<!-- Terrain Region: a dashed selection box with corner handles over a small
     patch of ground. Lucide-style, 24x24, currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Corner handles -->
  <rect x="3" y="3" width="3" height="3" rx="0.5"/>
  <rect x="18" y="3" width="3" height="3" rx="0.5"/>
  <rect x="3" y="18" width="3" height="3" rx="0.5"/>
  <rect x="18" y="18" width="3" height="3" rx="0.5"/>
  <!-- Dashed sides between the handles -->
  <path d="M9 4.5h6" stroke-dasharray="1.5 3"/>
  <path d="M9 19.5h6" stroke-dasharray="1.5 3"/>
  <path d="M4.5 9v6" stroke-dasharray="1.5 3"/>
  <path d="M19.5 9v6" stroke-dasharray="1.5 3"/>
  <!-- Ground inside the region -->
  <path d="M7.5 15C9.5 15 10 11 12 11S14.5 15 16.5 15"/>
</svg>
