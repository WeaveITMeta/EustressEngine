<!-- Terrain Sculpt: a terrain profile that rises on the left (up arrow)
     and sinks on the right (down arrow). Lucide-style, 24x24, currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Profile: hill on the left, dip on the right -->
  <path d="M2 16c2.5 0 3-4 5-4s2.5 4 5 4s3 4 5 4s2.5-4 5-4"/>
  <!-- Grow: up arrow over the hill -->
  <path d="M7 9.5V3.5"/>
  <path d="M4.75 5.75 7 3.5l2.25 2.25"/>
  <!-- Erode: down arrow over the dip -->
  <path d="M17 7.5v6"/>
  <path d="M14.75 11.25 17 13.5l2.25-2.25"/>
</svg>
