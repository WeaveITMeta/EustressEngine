<!-- Plane Lock: a flat plane in perspective with a small padlock above it.
     Lucide-style, 24x24, currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Plane -->
  <path d="M3 20H16L21 15H8Z"/>
  <!-- Padlock: shackle and body -->
  <path d="M10 7.5V5.5A2 2 0 0 1 14 5.5V7.5"/>
  <rect x="8.5" y="7.5" width="7" height="5" rx="1"/>
</svg>
