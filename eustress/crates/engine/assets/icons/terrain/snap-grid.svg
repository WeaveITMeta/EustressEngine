<!-- Snap to Grid: a 3x3 grid of lines with a dot snapped onto the top-right
     intersection. Lucide-style, 24x24, currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Horizontal lines (the top one stops short of the snapped dot) -->
  <path d="M3 6h11"/>
  <path d="M3 12h18"/>
  <path d="M3 18h18"/>
  <!-- Vertical lines (the right one stops short of the snapped dot) -->
  <path d="M6 3v18"/>
  <path d="M12 3v18"/>
  <path d="M18 10v11"/>
  <!-- Snapped point -->
  <circle cx="18" cy="6" r="2.2" fill="currentColor" stroke="none"/>
</svg>
