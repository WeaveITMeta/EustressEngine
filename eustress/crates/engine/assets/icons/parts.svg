<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- Parts: an exploded assembly. Three layers separated along one axis,
       because a V-Cell part IS a layer in a stack and the section holds the
       objects a design is made of. -->
  <g stroke="#5CA8FF" stroke-width="0.75" stroke-linejoin="round">
    <path d="M8 1.6l5.4 2.1L8 5.8 2.6 3.7z" fill="#1A4670"/>
    <path d="M8 6.0l5.4 2.1L8 10.2 2.6 8.1z" fill="#163A5E"/>
    <path d="M8 10.4l5.4 2.1L8 14.6 2.6 12.5z" fill="#13314F"/>
  </g>
  <!-- the separation the explosion is showing -->
  <g stroke="#3B82F6" stroke-width="0.5" opacity="0.65" stroke-dasharray="0.9 0.9">
    <line x1="8" y1="5.9" x2="8" y2="6.0"/>
    <line x1="8" y1="10.3" x2="8" y2="10.4"/>
  </g>
</svg>
