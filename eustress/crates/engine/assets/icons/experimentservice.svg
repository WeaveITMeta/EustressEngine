<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- ExperimentService: a flask holding a measured trace.
       It shared dataservice.svg and the two were indistinguishable in the
       Explorer. They hold different things: DataService is series and tables,
       this is the RUNS that produced them, with the parts and laws behind
       each. The flask says "experiment", the rising trace says "measured",
       and the palette matches dataservice so they still read as siblings. -->
  <!-- neck -->
  <path d="M6.4 2.2v3.1L3.3 11.4a2.1 2.1 0 0 0 1.8 3.2h5.8a2.1 2.1 0 0 0 1.8-3.2L9.6 5.3V2.2"
        stroke="#5CA8FF" stroke-width="0.95" stroke-linejoin="round"/>
  <path d="M5.6 2.2h4.8" stroke="#5CA8FF" stroke-width="0.95" stroke-linecap="round"/>
  <!-- contents, so it reads as a flask in use rather than empty glass -->
  <path d="M4.15 10.6h7.7l1.05 2.1a2.1 2.1 0 0 1-1.8 1.9H4.9a2.1 2.1 0 0 1-1.8-1.9z"
        fill="#13314F"/>
  <!-- the run: a trace rising through the contents, in the DataService greens
       and reds so the family reads at a glance -->
  <path d="M4.7 13.3l1.9-2.1 1.5 1.2 1.4-1.6 1.6 1.1"
        stroke="#35D07A" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11.1" cy="11.9" r="0.85" fill="#FF5A5A"/>
</svg>
