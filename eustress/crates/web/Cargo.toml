# =============================================================================
# Eustress Web - Leptos Frontend
# =============================================================================
# Table of Contents:
# 1. Package Metadata
# 2. Dependencies (Leptos, WASM, HTTP)
# 3. Features
# 4. Build Configuration
# =============================================================================

[package]
name = "eustress-web"
version = "0.1.0"
edition = "2021"
description = "Eustress Web Frontend - Built with Leptos + Trunk"
authors = ["WeaveSolutions <admin@weave.solutions>"]
license = "PolyForm-Shield-1.0.0"

# =============================================================================
# 1. Dependencies
# =============================================================================

[dependencies]
eustress-avatar-schema = { path = "../avatar-schema", default-features = false }
# Leptos - Reactive Rust Framework. The rendering mode is a crate feature:
# `csr` (default, the Trunk build) or `ssr` (the prerender bin, see
# src/bin/prerender.rs). They are exclusive on purpose: `csr` turns effects
# on, and an effect running inside a server render reaches for a window that
# is not there.
leptos = { version = "0.7" }
leptos_router = "0.7"
leptos_meta = "0.7"

# Server rendering only. hydration_context supplies the shared context a root
# Owner needs to render on the server. any_spawner's futures executor gives
# spawn_local somewhere to park a future that is never polled, so a page that
# fires a fetch on construction renders its loading state instead of aborting
# the prerender.
hydration_context = { version = "0.2", optional = true }
any_spawner = { version = "0.2", features = ["futures-executor"], optional = true }

# WASM utilities
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    # Pointer-driven tilt on the hero render (see components::tilt)
    "MouseEvent",
    "MediaQueryList",
    "CssStyleDeclaration",
    "DomRect",
    "HtmlImageElement",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "WebGl2RenderingContext",
    "Storage",
    "Clipboard",
    "Location",
    "History",
    "Navigator",
    "Performance",
    "Notification",
    "NotificationOptions",
    "NotificationPermission",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "Url",
    "UrlSearchParams",
    "HtmlAnchorElement",
    "FormData",
    # Live document capture (/verify): rear camera, frame grab, crop + clean
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaTrackConstraints",
    "MediaTrackSettings",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "BlobPropertyBag",
    "DomException",
    "DomRect",
] }

# QR code generation for the desktop → mobile verification handoff.
# default-features off keeps the `image` and `svg` render backends (and their
# dependency trees) out of the WASM bundle; we render the module matrix to
# SVG rects ourselves in `components::qr`.
qrcode = { version = "0.14", default-features = false }

# HTTP Client (WASM-compatible)
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

# Async
futures = "0.3"

# Logging
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

# Bliss (crypto currency): published crates from crates.io
bliss-core = "0.1.1"
bliss-crypto = "0.1.1"
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }

# Utilities
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
urlencoding = "2.1"

# =============================================================================
# 2. Features
# =============================================================================

[features]
default = ["csr"]
# Client-side rendering: the WASM bundle Trunk builds for the browser.
csr = ["leptos/csr"]
# For SSR/hydration mode (future use with cargo-leptos)
hydrate = ["leptos/hydrate"]
# Server rendering, used by the prerender bin to write every public route to
# static HTML for crawlers and agents. Build with --no-default-features so
# `csr` stays off.
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:hydration_context",
    "dep:any_spawner",
]

# =============================================================================
# 3. Build Configuration
# =============================================================================

[lib]
crate-type = ["cdylib", "rlib"]

# Renders the public routes into dist/ after `trunk build`. Native only, so it
# never ends up in the WASM bundle.
[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["ssr"]

# Note: Profile settings moved to workspace Cargo.toml

[package.metadata.leptos]
output-name = "eustress-web"
site-root = "target/site"
site-pkg-dir = "pkg"
