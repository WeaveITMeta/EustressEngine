    <!-- Crawler and agent discovery. These live at the site root, not under
         /assets, because the root is the only place a crawler looks for them.
         The Markdown docs mirror their repo paths so a URL doubles as a
         source pointer; llms.txt is the index agents read first. -->
    <link data-trunk rel="copy-file" href="robots.txt" />
    <link data-trunk rel="copy-file" href="sitemap.xml" />
    <link data-trunk rel="copy-file" href="llms.txt" />
    <link data-trunk rel="copy-file" href="../../../docs/api/WEBSITE_SERVICE_API.md" data-target-path="docs/api" />
    <link data-trunk rel="copy-file" href="../../../docs/api/WEBSITE_MANIFEST_INTEGRATION.md" data-target-path="docs/api" />
    <link data-trunk rel="copy-file" href="../../../docs/design/WEBSITE_SERVICE.md" data-target-path="docs/design" />

    <!-- Prerendered pages carry their content inside #app (see
         src/bin/prerender.rs). Without scripts the loading overlay would
         sit on top of it forever, so hide it for that case only. -->
    <noscript><style>#loading { display: none !important; }</style></noscript>

    <!-- Favicon -->
    <link data-trunk rel="copy-dir" href="assets" />
    <!-- Measures the scrollbar so the full-width footer does not overflow the page. -->
    <script src="/assets/scrollbar.js"></script>
    <link data-trunk rel="copy-file" href="_headers" />
    <link data-trunk rel="copy-file" href="_redirects" />
    <link data-trunk rel="copy-dir" href=".well-known" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/assets/site.webmanifest">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <script type="module" src="/assets/vendor/model-viewer-4.0.0.min.js"></script>
    <link data-trunk rel="css" href="style/main.css">
    <link data-trunk rel="css" href="style/take_it_down.css">
    <!-- Purchases page and the profile's spending card. A file of its own
         so it can be read and changed without the 550 KB main sheet. -->

    <!-- The creator dashboard (/creator) and a listing's pass store. -->
    <link data-trunk rel="css" href="style/creator.css">
    <link data-trunk rel="css" href="style/projects_sell.css">
    <!-- A listing's Live or Offline badge and its Play hand-off panel. -->
    <link data-trunk rel="css" href="style/live.css">
    <!-- The review panel on /projects: what review decided, and the appeal. -->
    <link data-trunk rel="css" href="style/review.css">
    <!-- A listing's play page (/play/:id): hero, Play area, details. -->
    <link data-trunk rel="css" href="style/play.css">
    <!-- The Gallery, a Space's page, the Play chooser and the search box. -->
    <link data-trunk rel="css" href="style/gallery.css">
    <link data-trunk rel="css" href="style/profile.css">

    <link data-trunk rel="css" href="style/home.css">

    <link data-trunk rel="css" href="style/project_tags.css">
    <!-- The top bar (components/nav.rs). Last, so it wins over the sheets above. -->
    <link data-trunk rel="css" href="style/login.css">
    <link data-trunk rel="css" href="style/community.css">
    <link data-trunk rel="css" href="style/topbar.css">
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Eustress Engine",
        "url": "https://eustress.dev",
        "logo": "https://eustress.dev/assets/logo.svg",
        "description": "Source-available simulation and data platform built in Rust",
        "sameAs": [
            "https://x.com/eustressengine",
            "https://discord.gg/DGP9my8DYN",
            "https://github.com/WeaveITMeta/EustressEngine"
        ],
        "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "url": "https://discord.gg/DGP9my8DYN"
        }
    }
    </script>
    
    <!-- Structured Data - Software Application -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Eustress Engine",
        "operatingSystem": "Windows, macOS, Linux",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "Simulation Software",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "featureList": [
            "100% Rust-powered",
            "Memory-safe",
            "Time compression (a year of simulation per second)",
            "Datasets first-class (Apache Arrow + Polars)",
            "10M+ entity scale",
            "AI-native control via MCP",
            "Soul / Rune / Luau scripting",
            "Source-available (PolyForm Shield), cross-platform"
        ],
        "softwareVersion": "0.16.1"
    }
    </script>
    
    <!-- Structured Data - WebSite (for sitelinks search) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Eustress Engine",
        "url": "https://eustress.dev",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "https://eustress.dev/gallery?q={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
    
    <!-- Structured data lists only what the site can stand behind; the tests in src/seo.rs check each address. -->
    
    <!-- WASM -->
    <link data-trunk rel="rust" href="Cargo.toml" data-target-name="eustress-web" data-wasm-opt="0" />
</head>
<body>
    <!-- App mounts here -->
    <div id="app"></div>
    
    <!-- Loading indicator (hidden by JS once WASM loads) -->
    <div id="loading" style="position:fixed;inset:0;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;font-family:Inter,sans-serif;">
        <div style="width:48px;height:48px;border:3px solid #333;border-top-color:#4682B4;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="margin-top:20px;font-size:14px;opacity:0.7;">Loading Eustress Engine...</p>
        <p id="loading-status" style="margin-top:8px;font-size:12px;opacity:0.5;"></p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    
    <!-- The loading indicator's logic is a file, not an inline script (Content-Security-Policy). -->
    <script src="/assets/loader.js"></script>
    
    <!-- Without scripts a prerendered page still reads; only the live parts
         (sign-in, the marketplace, anything that talks to the API) need
         WebAssembly. -->
    <noscript>
        <div class="noscript-warning" style="padding:24px;text-align:center;color:#fff;background:#0a0a12;">
            <p>You are reading the static copy of this page. Signing in and the interactive parts of the site need JavaScript (WebAssembly).</p>
        </div>
    </noscript>
</body>
</html>
