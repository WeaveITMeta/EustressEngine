[package]
name = "eustress-client"
version = "0.1.0"
edition = "2021"
description = "Eustress Client - Generative Player & Renderer"

[[bin]]
name = "eustress-client"
path = "src/main.rs"

[dependencies]
# Workspace members
eustress-common = { path = "../common", features = ["gui", "realism-scripting", "luau", "physics", "realism"] }
eustress-networking = { path = "../common/eustress-networking" }  # p2p feature dropped: bevy_quinnet has no bevy-0.19 release (see docs/architecture/BEVY_019_MIGRATION.md)
bevy-camera-controller = { path = "../common/bevy-camera-controller" }

# Workspace dependencies (Bevy 0.19)
bevy = { workspace = true, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_pbr",
    "bevy_gltf",
    "bevy_scene",
    "bevy_animation",
    # REQUIRED for the glTF loader to emit `Animation*` labels at all.
    # Bevy 0.19 split this out: `bevy_animation` only compiles the animation
    # runtime, while `gltf_animation = ["bevy_animation",
    # "bevy_gltf?/bevy_animation"]` is what turns on animation PARSING in
    # bevy_gltf. Without it every character .glb loads its nodes, scene and
    # skin but zero clips, and `AssetServer` reports
    # "does not contain the labeled asset 'Animation0'".
    "gltf_animation",
    "bevy_color",
    "default_font",
    "bevy_asset",
    "png",
    "hdr",
    "ktx2",
    "x11",
    "wayland",
    "multi_threaded",
] }

# Physics (Avian3D from workspace - supports Bevy 0.18)
avian3d = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
uuid = { workspace = true }

# Enhancement pipeline (Bevy 0.17 compatible)
# bevy_egui removed - using Slint UI
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
serde_json = { workspace = true }
dirs = { workspace = true }
sha2 = "0.10"
# Published-content pipeline: a .pak is tar + zstd of the Universe
# directory (engine/src/ui/file_event_handler.rs:912-963), so the Player
# needs both to open one.
zstd = "0.13"
tar = "0.4"

# The window/taskbar icon is set at runtime because winit registers its window
# class with `hIcon: 0` — the .ico embedded by build.rs only reaches Explorer.
# Both versions match what Bevy 0.19 already resolves, so neither adds a
# second copy to the build.
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

base64 = "0.21"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
gltf = "1.4.1"
rune = "0.14"

# AI/ML (uncomment when ready)
# candle-core = { git = "https://github.com/huggingface/candle.git", rev = "candle-v0.6.0" }
# candle-nn = { git = "https://github.com/huggingface/candle.git", rev = "candle-v0.6.0" }
# candle-transformers = { git = "https://github.com/huggingface/candle.git", rev = "candle-v0.6.0" }

# Client-specific dependencies
# bevy_hanabi = "0.12"  # Particle effects
# bevy_atmosphere = "0.10"  # Sky rendering
# Add AI/ML deps here later:
# candle-core = { version = "0.6", features = ["cuda"] }
# candle-transformers = "0.6"

[build-dependencies]
# The icon is rasterised from assets/icon.svg at build time so the SVG stays
# the single source for both the PE resource and the runtime window icon.
resvg = "0.44"
ico = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
dev = ["bevy/dynamic_linking"]
hotpatch = ["bevy/hotpatching"]
