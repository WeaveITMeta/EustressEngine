[package]
name = "texture-gen"
version = "0.2.0"
edition = "2021"
description = "Eustress material textures: the seamless PBR library generator (bin) and the mip-chain builder the engine runs when it loads a material map (lib)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "texture-gen"
path = "src/main.rs"

[dependencies]
png = "0.17"
